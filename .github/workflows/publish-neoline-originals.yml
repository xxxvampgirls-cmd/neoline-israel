name: NEOLINE - publish original ZX tracker music without PT3 conversion
on:
  push:
    branches: [main]
    paths:
      - 'assets/teoria/source/new.zip'
      - 'assets/teoria/source/new.zip.b64'
      - 'scripts/publish_neoline_originals.py'
      - '.github/workflows/publish-neoline-originals.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: neoline-native-ay-music
  cancel-in-progress: false
jobs:
  publish-originals:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Check source archive is uploaded
        id: source
        shell: bash
        run: |
          if [ -f assets/teoria/source/new.zip ] || [ -f assets/teoria/source/new.zip.b64 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Original ZIP not published yet. Static player will offer import instead."
          fi
      - name: Extract exact untouched original music
        if: steps.source.outputs.ready == 'true'
        run: python3 scripts/publish_neoline_originals.py
      - name: Verify each published module against the manifest
        if: steps.source.outputs.ready == 'true'
        run: |
          python3 - <<'PY'
          import json, pathlib, hashlib
          p=pathlib.Path('assets/teoria/originals')
          m=json.loads((p/'manifest.json').read_text())
          assert len(m['files']) == 19
          for song in m['files']:
              b=(p/song['name']).read_bytes()
              assert len(b) == song['bytes'],song['name']
              assert hashlib.sha256(b).hexdigest()==song['sha256'],song['name']
          print("Verified 19 untouched original ZX Spectrum tracker files.")
          PY
      - name: Commit source-format music for browser playback
        if: steps.source.outputs.ready == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/teoria/originals/
          if git diff --cached --quiet; then
            echo "Original formats already published"
            exit 0
          fi
          git commit -m "Publish original ZX Spectrum files (no PT3 conversion)"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main || { git rebase --abort || true; exit 1; }
            git push origin HEAD:main && exit 0
            sleep 3
          done
          exit 1
