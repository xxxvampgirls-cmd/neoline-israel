name: NEOLINE news freshness watchdog
on:
  workflow_dispatch:
  schedule:
    # Check twice hourly; GitHub schedule can be delayed.
    - cron: '12,42 * * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/sync_news.py'
      - '.github/workflows/sync-news.yml'
      - '.github/workflows/watch-news-freshness.yml'
permissions:
  contents: read
  issues: write
  actions: write
concurrency:
  group: neoline-news-watchdog
  cancel-in-progress: false
jobs:
  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Verify news health (not just presence of cached cards)
        id: check
        continue-on-error: true
        run: |
          python - <<'PY'
          import datetime as dt, json, os
          from pathlib import Path
          now = dt.datetime.now(dt.timezone.utc)
          try:
              data = json.loads(Path("assets/news/news.json").read_text(encoding="utf-8"))
              report = json.loads(Path("assets/news/sync-report.json").read_text(encoding="utf-8"))
              updated = dt.datetime.fromisoformat(data["updated"].replace("Z","+00:00"))
              attempted = dt.datetime.fromisoformat(report["attempted"].replace("Z","+00:00"))
              age_h = (now-updated).total_seconds()/3600
              check_h = (now-attempted).total_seconds()/3600
              articles = len(data.get("items",[]))
              publishers = len(report.get("sources",{}))
              recent = max((dt.datetime.fromisoformat(item["date"].replace("Z","+00:00")) for item in data["items"]),default=None)
              newest_h = (now-recent).total_seconds()/3600 if recent else 9999
              print(f"HEALTH: last_success={age_h:.2f}h; last_run={check_h:.2f}h; latest_article={newest_h:.2f}h; articles={articles}; publishers={publishers}")
              assert data["version"]==1 and articles>0 and data["retentionDays"]==30
              assert data["lawsRetentionMonths"]==6 and report.get("directLinksOnly") is True
              assert 0<=age_h<3, "No published update in last 3 hours"
              assert 0<=check_h<3, "No collector attempt in last 3 hours"
              assert publishers>=3, "Fewer than three independent publishers"
              assert 0<=newest_h<48, "No newly published source article in 48 hours"
          except Exception as e:
              print("NEWS WATCHDOG FAILURE:",repr(e))
              raise SystemExit(1)
          PY
      - name: Automatically restart stalled news collection (self-healing)
        if: steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # An old source article is not itself a reason to loop endlessly.
          # Restart only if the collector has stopped writing snapshots.
          python - <<'PY'
          import datetime as dt,json,os
          from pathlib import Path
          now=dt.datetime.now(dt.timezone.utc)
          try:
              feed=json.loads(Path("assets/news/news.json").read_text())
              report=json.loads(Path("assets/news/sync-report.json").read_text())
              last=dt.datetime.fromisoformat(feed["updated"].replace("Z","+00:00"))
              attempted=dt.datetime.fromisoformat(report["attempted"].replace("Z","+00:00"))
              overdue=max((now-last).total_seconds(),(now-attempted).total_seconds())>2*3600
          except Exception: overdue=True
          Path(os.environ["RUNNER_TEMP"],"news_recovery_needed").write_text(str(int(overdue)))
          print("Collector overdue:",overdue)
          PY
          if [ "$(cat "$RUNNER_TEMP/news_recovery_needed")" != 1 ]; then
            echo "Collector ran recently. News publisher cadence is a separate issue."
            exit 0
          fi
          # Do not stack duplicate 45-minute fetches on top of an active run.
          active="$(gh run list --workflow sync-news.yml --limit 10 --json status --jq '[.[] | select(.status == "in_progress" or .status == "queued" or .status == "waiting" or .status == "pending")] | length')"
          if [ "$active" != 0 ]; then
            echo "News collector is already active ($active runs); no duplicate dispatch."
            exit 0
          fi
          gh workflow run sync-news.yml --ref main
          echo "SELF HEAL: dispatched the stalled news collector."
      - name: Open or close one persistent news-failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NEWS_HEALTH_RESULT: ${{ steps.check.outcome }}
        run: |
          set -euo pipefail
          title='NEOLINE NEWS: automatic feed refresh stalled'
          existing="$(gh issue list --state open --limit 100 --json number,title --jq '.[] | select(.title == "NEOLINE NEWS: automatic feed refresh stalled") | .number' | head -n 1)"
          if [ "$NEWS_HEALTH_RESULT" != success ]; then
            if [ -z "$existing" ]; then
              gh issue create --title "$title" --body "Automatic news freshness check failed. News feed must be refreshed; inspect the latest sync-news workflow and assets/news/sync-report.json. Do NOT invent dates or articles. Monitoring runs twice hourly and on collector code changes. [Workflow runs](https://github.com/$GH_REPO/actions/workflows/sync-news.yml)."
            else
              echo "Existing open alert: #$existing (no duplicate issue)"
            fi
            exit 1
          fi
          if [ -n "$existing" ]; then
            gh issue close "$existing" --comment "Automatic check recovered: feed timestamp, original sources, and current news all passed."
          fi
          echo "Fresh news verified. No open alert."
