name: Browser-check NEOLINE Israel driving theory quest
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'teoria.html'
      - 'teoria*.js'
      - 'teoria*.css'
      - 'assets/teoria/**'
      - '.github/workflows/test-teoria.yml'
permissions:
  contents: read
jobs:
  game:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start local production-equivalent server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/neoline-theory.log 2>&1 &
      - name: Test four official banks, gameplay, Game Over, exam and progress
        run: |
          node <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
           const browser=await chromium.launch({headless:true});
           const page=await browser.newPage({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
           const errors=[];
           page.on('pageerror',e=>errors.push(e.message));
           await page.goto('http://127.0.0.1:8765/teoria.html',{waitUntil:'domcontentloaded'});
           const wait=async()=>page.waitForFunction(()=>document.getElementById('bankStatus')?.classList.contains('loaded'),null,{timeout:20000});
           await wait();
           for(const [lang,rtl] of [['ru',false],['en',false],['he',true],['ar',true]]){
             if(lang!=='ru')await page.locator('[data-lang="'+lang+'"]').click();
             await page.waitForFunction(l=>document.documentElement.lang===l&&document.getElementById('bankStatus')?.classList.contains('loaded'),lang,{timeout:20000});
             const doc=await page.evaluate(async l=>{
               const r=await fetch('./assets/teoria/'+l+'.json');
               if(!r.ok)throw Error('Missing question bank '+l);
               const x=await r.json();
               return {
                 language:x.language,total:x.questions.length,
                 b:x.questions.filter(q=>q.classes.includes('B')).length,
                 bad:x.questions.filter(q=>q.a.length!==4||q.correct<0||q.correct>3||!q.q).length,
                 arabic:x.questions.filter(q=>/[\u0600-\u06ff]/.test(q.q)).length,
               };
             },lang);
             if(doc.language!==lang||doc.total<1500||doc.b<1000||doc.bad)throw Error('Question bank invalid '+JSON.stringify(doc));
             if(lang==='ar'&&doc.arabic<1500)throw Error('Arabic questions missing '+JSON.stringify(doc));
             const direction=await page.locator('html').getAttribute('dir');
             if(direction!==(rtl?'rtl':'ltr'))throw Error('Direction wrong for '+lang+' got '+direction);
             if(await page.locator('[data-lang="'+lang+'"]').getAttribute('aria-pressed')!=='true')
               throw Error('Language control not selected for '+lang);
             await page.locator('[data-mode="route"]').click();
             if(!await page.locator('#gamePlaying').isVisible())throw Error('Route missing '+lang);
             if(await page.locator('#answers button').count()!==4)throw Error('Answer count wrong '+lang);
             if(lang==='ar'&&!(await page.locator('#questionText').innerText()).match(/[\u0600-\u06ff]/))
               throw Error('Arabic route question not translated');
             await page.locator('#answers button').first().click();
             if(!await page.locator('#nextQuestion').isHidden())throw Error('Old Next button visible '+lang);
             if(!await page.locator('#feedback').isVisible())throw Error('Missing practice feedback '+lang);
             await page.locator('#exitQuiz').click();
             if(!await page.locator('#gameLobby').isVisible())throw Error('Leaving game failed '+lang);
             if(lang==='ar'){
               await page.locator('#gameProgressOpen').click();
               if(!await page.locator('#gameProgressDialog').isVisible())throw Error('Arabic progress modal inaccessible');
               if(!(await page.locator('#gameProgressTitle').innerText()).includes('تقدّمي'))
                 throw Error('Progress untranslated in Arabic');
               await page.locator('#gameProgressClose').click();
             }
             console.log('OFFICIAL THEORY',lang,JSON.stringify(doc));
           }
           await page.locator('[data-lang="ru"]').click();
           await wait();
           const bank=await page.evaluate(async()=>((await(await fetch('./assets/teoria/ru.json')).json()).questions.map(q=>({id:String(q.id),correct:q.correct}))));
           await page.locator('[data-mode="route"]').click();
           for(let attempt=0;attempt<3;attempt++){
             await page.evaluate(bank=>{
               const id=document.getElementById('questionId').textContent.replace(/\D/g,'');
               const q=bank.find(x=>x.id===id);
               if(!q)throw Error('Official question missing '+id);
               const bad=[...document.querySelectorAll('#answers button')].find(el=>Number(el.dataset.original)!==q.correct);
               if(!bad)throw Error('No wrong answer choice');
               bad.click();
             },bank);
             if(attempt<2)await page.waitForFunction(x=>document.getElementById('questionCounter')?.textContent===x&&
               document.querySelector('#answers button')&&!document.querySelector('#answers button').disabled,
               (attempt+1)+' / 10',{timeout:10000});
           }
           await page.locator('#gameOver').waitFor({state:'visible',timeout:10000});
           if(!(await page.locator('#gameOverScore').innerText()).includes('/ 3'))throw Error('Game over score incorrect');
           await page.locator('#gameOverRetry').click();
           if(await page.locator('#gameOver').isVisible()||!await page.locator('#gamePlaying').isVisible())throw Error('Replay failed');
           await page.locator('#exitQuiz').click();
           await page.locator('[data-mode="exam"]').click();
           if(!await page.locator('#timerBox').isVisible())throw Error('40 min mock-exam clock missing');
           await page.locator('#answers button').first().click();
           if(await page.locator('#feedback').isVisible())throw Error('Exam leaked correct answer');
           await page.locator('#exitQuiz').click();
           for(const width of [320,390]){
             await page.setViewportSize({width,height:844});
             const dims=await page.evaluate(()=>({document:document.documentElement.scrollWidth,window:innerWidth}));
             if(dims.document>dims.window+3)throw Error('Horizontal overflow '+JSON.stringify(dims));
           }
           if(errors.length)throw Error('Game JS errors: '+errors.join(' | '));
           console.log('NEOLINE THEORY PASS: 4 languages, official questions, RTL, practice, 3-life Game Over, replay, hidden exam answers');
           await browser.close();
          })().catch(e=>{console.error(e);process.exitCode=1});
          JS
