name: Browser-check NEOLINE Israel driving theory quest
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'teoria.html'
      - 'teoria.css'
      - 'teoria.js'
      - 'index.html'
      - 'assets/teoria/**'
      - '.github/workflows/test-teoria.yml'
permissions:
  contents: read
jobs:
  game:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Install Chromium
        run: |
          npm install --no-save playwright
          npx playwright install chromium
      - name: Verify public official bank, mobile gameplay, exam and progress
        run: |
          node <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const errors=[];
            const page=await browser.newPage({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
            page.on('pageerror',e=>errors.push(e.message));
            const origin='https://neoline-israel.pages.dev';
            // Cloudflare Pages deploys asynchronously; allow an upcoming asset version.
            for(let i=0;i<5;i++){
              await page.goto(origin+'/teoria.html?ci='+i,{waitUntil:'domcontentloaded',timeout:40000});
              const script=page.locator('script[src*="teoria.js"]'),css=page.locator('link[rel="stylesheet"][href*="teoria.css"]');
              if(await script.count()&&await css.count()&&await page.locator('[data-mode="route"]').count())break;
              await page.waitForTimeout(4000);
            }
            if(await page.locator('script[src*="teoria.js"]').count()!==1||
                await page.locator('link[rel="stylesheet"][href*="teoria.css"]').count()!==1)throw Error('Theory page CSS/JS malformed');
            await page.waitForFunction(()=>document.getElementById('bankStatus').classList.contains('loaded'),null,{timeout:60000});
            const bank=await page.evaluate(async()=>{
              const response=await fetch('./assets/teoria/ru.json');if(!response.ok)throw Error('bank response '+response.status);
              const b=await response.json();
              return {total:b.questions.length,forB:b.questions.filter(q=>q.classes.includes('B')).length,images:b.questions.filter(q=>q.image).length,
                countSigns:b.questions.filter(q=>q.topic==='signs'&&q.classes.includes('B')).length,
                bad:b.questions.filter(q=>q.a.length!==4||q.correct<0||q.correct>3||!q.id).length};
            });
            if(bank.total<1500||bank.forB<1000||bank.images<350||bank.countSigns<100||bank.bad)throw Error('Incomplete real question bank '+JSON.stringify(bank));
            const font=await page.locator('body').evaluate(el=>getComputedStyle(el).fontFamily);
            if(!font.includes('Manrope'))throw Error('Game stylesheet not applied: '+font);
            const width=await page.evaluate(()=>({page:document.documentElement.scrollWidth,window:innerWidth}));
            if(width.page>width.window+3)throw Error('Game overflows 390px '+JSON.stringify(width));
            console.log('OFFICIAL BANK GAME PASS '+JSON.stringify(bank));
            // Compact quick-play launcher: players should choose a mode immediately
            // on a real phone, with no huge welcome poster or information counters.
            const quick=await page.evaluate(()=>{
              const box=selector=>{const el=document.querySelector(selector);if(!el)return null;
                const r=el.getBoundingClientRect();return {top:Math.round(r.top),bottom:Math.round(r.bottom),
                  height:Math.round(r.height),width:Math.round(r.width),display:getComputedStyle(el).display}};
              const cards=[...document.querySelectorAll('#modeGrid [data-mode]')].map(el=>{
                const r=el.getBoundingClientRect();return {name:el.dataset.mode,top:Math.round(r.top),
                bottom:Math.round(r.bottom),width:Math.round(r.width)}
              });
              return {hero:box('.game-hero'),lobby:box('#gameLobby'),bank:box('#bankStatus'),
                progressOpen:document.querySelector('#progressDisclosure').open,
                heroChips:!!document.querySelector('.hero-chips'),
                roadScene:!!document.querySelector('.road-scene'),
                intro:!!document.querySelector('#heroSubtitle'),cards};
            });
            console.log('QUICK PLAY FIRST FOLD '+JSON.stringify(quick));
            if(quick.heroChips||quick.roadScene||quick.intro)
              throw Error('Large introduction and information cloud must be removed');
            if(quick.bank?.display!=='none'||quick.progressOpen)
              throw Error('Loaded-bank info and progress numbers must not crowd game modes');
            if(quick.hero.bottom>190||quick.cards[0].top>345||
               Math.max(...quick.cards.slice(0,4).map(c=>c.bottom))>710||quick.cards[4].bottom>810)
              throw Error('Game modes are not immediately tappable on first phone screen: '+JSON.stringify(quick));
            if(quick.cards.length!==5||quick.cards.some(c=>c.width<118))
              throw Error('Five easy-to-tap modes must be visible without horizontal clipping');
            await page.locator('#progressSummary').click();
            if(!await page.locator('#statsRow').isVisible())throw Error('Collapsible personal progress is inaccessible');
            await page.locator('#progressSummary').click();
            if(await page.locator('#statsRow').isVisible())throw Error('Progress should collapse again');
            const officialLabel=await page.locator('#modeMarathon').innerText();
            if(!/путешествие|билеты/i.test(officialLabel))
              throw Error('All-ticket journey mode missing');
            await page.locator('[data-mode="marathon"]').click();
            if(await page.locator('.game-hero').isVisible())
              throw Error('Welcome header should disappear when game begins');
            if(!await page.locator('#gamePlaying').isVisible()||
               await page.locator('#questionCounter').textContent()!=='1 / 20')
              throw Error('All-question 20-step journey failed');
            await page.locator('#answers button').first().click();
            await page.locator('#nextQuestion').click();
            if(await page.locator('#questionCounter').textContent()!=='2 / 20')
              throw Error('Marathon 20-question progress broken');
            await page.locator('#exitQuiz').click();
            if(!await page.locator('.game-hero').isVisible())
              throw Error('Compact game header not restored after leaving question view');
            console.log('ALL-TICKETS JOURNEY PASS: full 1801-bank, 20-question stages, new questions prioritised');
            await page.locator('[data-mode="route"]').click();
            if(!await page.locator('#gamePlaying').isVisible())throw Error('Route does not start');
            let firstId=await page.locator('#questionId').textContent();
            if(!/^№ \d+$/.test(firstId))throw Error('Official question number missing: '+firstId);
            const firstAnswers=page.locator('#answers button');
            if(await firstAnswers.count()!==4)throw Error('Not four official answer options');
            await firstAnswers.first().click();
            if(!await page.locator('#nextQuestion').isEnabled())throw Error('Next button disabled after answer');
            if(!await page.locator('#feedback').isVisible())throw Error('Practice must reveal feedback');
            await page.locator('#nextQuestion').click();
            if(await page.locator('#questionCounter').textContent()!=='2 / 10')throw Error('Route progression broken');
            await page.locator('#exitQuiz').click();
            if(!await page.locator('#gameLobby').isVisible())throw Error('Back to game modes broken');
            await page.locator('[data-mode="mistakes"]').count();
            await page.locator('[data-mode="signs"]').click();
            const signsTopic=await page.locator('#questionTopic').innerText();
            if(!/знаки/i.test(signsTopic))throw Error('Road sign mode not filtering signs: '+signsTopic);
            await page.locator('#exitQuiz').click();
            await page.locator('[data-mode="exam"]').click();
            if(await page.locator('#timerBox').isHidden())throw Error('Mock exam timer missing');
            for(let i=0;i<30;i++){
              const answer=page.locator('#answers button').first();
              await answer.click();
              if(await page.locator('#feedback').isVisible())throw Error('Mock exam leaked correct answers before finish');
              await page.locator('#nextQuestion').click();
            }
            if(!await page.locator('#gameResult').isVisible())throw Error('30 question exam did not finish');
            const result=await page.locator('#resultScore').textContent();
            if(!/\/ 30/.test(result))throw Error('Wrong exam result '+result);
            console.log('MOCK EXAM PASS 30 questions + timer + answer secrecy '+result);
            await page.locator('#backToModes').click();
            await page.locator('button[data-lang="he"]').click();
            await page.waitForFunction(()=>document.getElementById('bankStatus').classList.contains('loaded'),null,{timeout:40000});
            const hebrew=await page.locator('#modeExam').textContent();
            if(!hebrew.includes('מבחן'))throw Error('Hebrew translation not working');
            if(await page.locator('html').getAttribute('dir')!=='rtl')throw Error('Hebrew layout not RTL');
            await page.locator('button[data-lang="en"]').click();
            await page.waitForFunction(()=>document.getElementById('bankStatus').classList.contains('loaded'),null,{timeout:40000});
            if(await page.locator('html').getAttribute('dir')!=='ltr')throw Error('English layout not LTR');
            console.log('LANGUAGES PASS RU/HE/EN');
            if(errors.length)throw Error('JS page errors '+errors.join('|'));
            await page.setViewportSize({width:320,height:720});
            await page.reload({waitUntil:'domcontentloaded'});
            await page.waitForFunction(()=>document.getElementById('bankStatus').classList.contains('loaded'),null,{timeout:40000});
            const size=await page.evaluate(()=>({page:document.documentElement.scrollWidth,w:innerWidth}));
            if(size.page>size.w+3)throw Error('Game mobile overflow at 320px '+JSON.stringify(size));
            console.log('MOBILE GAME PASS 320px and 390px JSerrors=0');

            // The compact game is a real NEOLINE page, not a detached app:
            // four blue/white/ink game buttons, SVG icons and an identical
            // five-link bottom dock that hides DOWN and reappears UP.
            let redesigned=false;
            for(let k=0;k<7;k++){
              redesigned=await page.locator('#theoryBottomNav [data-theory-nav]').count()===5&&
                await page.locator('#modeGrid .route-card .route-icon svg').count()===5;
              if(redesigned)break;
              await page.waitForTimeout(5500);
              await page.reload({waitUntil:'domcontentloaded'});
              await page.waitForFunction(()=>document.getElementById('bankStatus').classList.contains('loaded'),null,{timeout:40000});
            }
            if(!redesigned)throw Error('Theory premium modes or five-item bottom dock not deployed yet');
            const navi=await page.evaluate(()=>{
              const nav=document.querySelector('#theoryBottomNav');
              const tiles=[...document.querySelectorAll('#modeGrid .route-card')];
              return {
                visible:getComputedStyle(nav).display!=='none',
                position:getComputedStyle(nav).position,
                links:[...nav.querySelectorAll('a')].map(x=>x.getAttribute('href')),
                animated:nav.dataset.navScrollBehavior==='directional',
                svgIcons:tiles.filter(t=>t.querySelector('.route-icon svg')).length,
                darkCardColor:getComputedStyle(tiles[2].querySelector('strong')).color,
                routes:tiles.map(t=>t.dataset.mode),
                width:document.documentElement.scrollWidth,
                viewport:innerWidth,
              };
            });
            console.log('THEORY NEW DESIGN + 5-LINK NAV '+JSON.stringify(navi));
            if(!navi.visible||navi.position!=='fixed'||!navi.animated||
               navi.links.join('|')!=='./|./#catalog|./news.html|./delivery.html|./?panel=cart'||
               navi.svgIcons!==5||navi.routes.join(',')!=='route,signs,exam,mistakes,marathon'||
               navi.darkCardColor!=='rgb(255, 255, 255)')
              throw Error('Brand palette, vector game modes or dock broken '+JSON.stringify(navi));
            if(navi.width>navi.viewport+3)throw Error('Nav/design causes 320px horizontal scroll');
            // A 720px high phone can fit most of this deliberately compact game;
            // shrink only the test viewport's height so downward scroll >105px exists.
            await page.setViewportSize({width:320,height:500});
            await page.evaluate(()=>window.scrollTo(0,document.documentElement.scrollHeight));
            console.log('BOTTOM NAV SCROLL DEBUG '+JSON.stringify(await page.evaluate(()=>({y:scrollY,scrollHeight:document.documentElement.scrollHeight,innerHeight,nav:document.getElementById('theoryBottomNav').className}))));
            await page.waitForFunction(()=>{const x=document.querySelector('#theoryBottomNav');return x.classList.contains('nav-scroll-hidden')&&getComputedStyle(x).visibility==='hidden';},null,{timeout:9000});
            await page.evaluate(()=>window.scrollBy(0,-140));
            await page.waitForFunction(()=>!document.getElementById('theoryBottomNav').classList.contains('nav-scroll-hidden'));
            await page.evaluate(()=>window.scrollTo(0,0));
            console.log('THEORY BOTTOM NAV DIRECTION PASS: 5 tabs, down hidden, up restored, no 320px overflow');

            // Theory promotion is the LAST carousel frame. It shares the
            // product-ad blue bands/halo but uses a single restrained 3D
            // digital quiz display, not the rejected cartoon driving scene.
            let homepageReady=false;
            for(let tryNum=0;tryNum<6;tryNum++){
              await page.goto(origin+'/?theory-ad-last='+tryNum,{waitUntil:'domcontentloaded',timeout:40000});
              homepageReady=await page.locator('#showcaseSlides .featured-slide--theory .theory-device').count()===1;
              if(homepageReady)break;
              await page.waitForTimeout(6000);
            }
            if(!homepageReady)throw Error('New premium last-slide theory artwork not published');
            const slides=page.locator('#showcaseSlides .featured-slide');
            if(await slides.count()!==5)throw Error('Expected five showroom slides');
            const last=slides.last();
            if(!(await last.getAttribute('class')).includes('featured-slide--theory'))
              throw Error('Theory ad must be LAST (not second)');
            if(await last.locator('a[href="./teoria.html"]').count()!==1)
              throw Error('Last carousel slide lost its working game CTA');
            if(await page.locator('#theoryPreviewStart,#openTheoryHeader,#theoryQuick').count())
              throw Error('Old standalone theory promo/header buttons were reintroduced');
            await page.locator('#showcaseDots .showcase-dot').last().click();
            if(!(await last.getAttribute('class')).includes('active'))
              throw Error('Last theory slide does not activate');
            const artwork=await last.evaluate(el=>{
              const frame=el.querySelector('.theory-stage');
              const device=el.querySelector('.theory-device');
              const ring=el.querySelector('.theory-halo');
              const bands=el.querySelectorAll('.ad-photo-band');
              const rect=x=>{const r=x.getBoundingClientRect();return {top:r.top,left:r.left,width:r.width,height:r.height,right:r.right,bottom:r.bottom}};
              return {
                stage:rect(frame),device:rect(device),
                halo:!!ring,bands:bands.length,signs:el.querySelectorAll('.theory-screen-sign').length,
                carDoodle:el.querySelectorAll('.theory-scene-car,.theory-art-car').length,
                stageOverflow:getComputedStyle(frame).overflow,
                photoOverflow:getComputedStyle(el.querySelector('.theory-featured-image')).overflow,
                slideOverflow:getComputedStyle(el).overflow,
                deviceAnimation:getComputedStyle(device).animationName,
                hasPrev:!!el.querySelector('[data-feature-prev]'),
                hasNext:!!el.querySelector('[data-feature-next]'),
                pageWidth:document.documentElement.scrollWidth,viewport:innerWidth
              };
            });
            console.log('PREMIUM LAST THEORY AD '+JSON.stringify(artwork));
            if(!artwork.halo||artwork.bands!==2||!artwork.hasPrev||!artwork.hasNext||artwork.signs!==1)
              throw Error('Theory photo-like blue-band design incomplete');
            if(artwork.carDoodle>0)throw Error('Rejected cartoon car is still present');
            if(artwork.stageOverflow==='hidden'||artwork.photoOverflow==='hidden'||artwork.slideOverflow==='hidden')
              throw Error('Premium illustration must pop past the inner frame');
            if(artwork.device.top>=artwork.stage.top)
              throw Error('Device must subtly escape above photo frame');
            if(artwork.deviceAnimation==='none')
              throw Error('Gentle floating motion missing');
            if(artwork.pageWidth>artwork.viewport+3)
              throw Error('The new ad creates mobile horizontal overflow '+JSON.stringify(artwork));
            await last.locator('[data-feature-next]').click();
            if(!(await slides.first().getAttribute('class')).includes('active'))
              throw Error('Arrow from LAST theory ad must wrap to first product slide');
            if(errors.length)throw Error('Homepage JS errors '+errors.join('|'));
            console.log('HOMEPAGE PREMIUM THEORY AD PASS: last slide, one 3D device, blue bands, halo, gentle motion, wrap and mobile width');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
