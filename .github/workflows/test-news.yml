name: Browser-check Israel auto-news and 30-day expiry
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "news.html"
      - "news-video-library.js"
      - "news-video-library.css"
      - "news-ui.js"
      - "news-ui.css"
      - "news-accidents.js"
      - "news-accidents.css"
      - "news-layout-polish.css"
      - "nav-current.js"
      - "hot.html"
      - "teoria.html"
      - "catalog-ui.css"
      - "catalog-ui.js"
      - "index.html"
      - "road-demo.js"
      - "road-demo.css"
      - "road-demo-premium.css"
      - "delivery.html"
      - "pickup-ui.css"
      - ".github/workflows/test-news.yml"
permissions:
  contents: read
jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Prepare Chromium
        run: |
          npm install --no-save playwright
          npx playwright install chromium
      - name: Check real published mobile news
        run: |
          node <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const errors=[];
            const page=await browser.newPage({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
            page.on('pageerror',e=>errors.push(e.message));
            await page.goto('https://neoline-israel.pages.dev/',{waitUntil:'domcontentloaded',timeout:40000});
            await page.waitForTimeout(800);
            await page.waitForFunction(()=>document.querySelectorAll('#products .product').length===8,{timeout:35000});
            const productsInitially=await page.locator('#products .product').count();
            if(productsInitially!==8)throw Error('Main catalog must show exactly 8 products initially, got '+productsInitially);
            await page.locator('#catalogShowMoreBtn').click();
            await page.waitForFunction(()=>document.querySelectorAll('#products .product').length===16,{timeout:10000});
            console.log('PRODUCT FIRST 8 PASS: 8 -> 16');
            // After swapping sort and search, dropdown must be fully onscreen
            // instead of spilling out of the mobile viewport at the left.
            for(const width of [320,390]){
              await page.setViewportSize({width,height:844});
              await page.locator('#catalogSortButton').click();
              const position=await page.locator('#catalogSortMenu').evaluate(el=>{
                const r=el.getBoundingClientRect();
                return {left:r.left,right:r.right,width:r.width,
                  viewport:document.documentElement.clientWidth,
                  visible:getComputedStyle(el).display!=='none'};
              });
              if(!position.visible||position.left<7||
                 position.right>position.viewport-7||position.width<250)
                throw Error('Sort dropdown cropped on '+width+'px Android: '+JSON.stringify(position));
              const labels=await page.locator('#catalogSortMenu .catalog-sort-option-label').allTextContents();
              if(labels.length!==3||labels.some(label=>!label.trim()))
                throw Error('Sort popup option text missing: '+JSON.stringify(labels));
              await page.locator('#catalogSortMenu [data-sort-value="low"]').click();
              if(await page.locator('#sort').inputValue()!=='low'||
                 await page.locator('#catalogSortButton').getAttribute('aria-expanded')!=='false')
                throw Error('Sort menu did not update price order and close');
            }
            await page.setViewportSize({width:390,height:844});
            console.log('CATALOG SORT POPUP PASS: 320px/390px complete visible labels and price sorting');
            const tabs=await page.locator('.mobile-nav>button, .mobile-nav>a').count();
            if(tabs!==5)throw Error('Expected five mobile navigation controls, got '+tabs);
            const deliveryTab=page.locator('#mobileDelivery');
            if(!await deliveryTab.isVisible()||!String(await deliveryTab.getAttribute('href')).endsWith('/delivery.html'))
              throw Error('Delivery tab missing from homepage bottom navigation');
            if(await page.locator('#mobileFav, #desktopFav, .product .heart').count())
              throw Error('Favorites/heart control still shown');
            if(await page.locator('#desktopDelivery').count()!==1)
              throw Error('Desktop delivery shortcut missing');
            console.log('HOMEPAGE DELIVERY NAV PASS: no favorites, truck link available');
            // Premium car demo: genuinely layered SVG/CSS, 4 interactive modes,
            // the entire frame MUST remain fixed height while text or HUD changes.
            const road=page.locator('#neolineRoadDemo');
            await road.scrollIntoViewIfNeeded();
            await page.waitForFunction(()=>document.getElementById('neolineRoadDemo')?.classList.contains('is-playing'),
              null,{timeout:2500});
            const motion=await road.locator('.road-demo-halo').evaluate(el=>getComputedStyle(el).animationName);
            if(!motion.includes('premiumRoadHalo'))
              throw Error('Central glow must animate while road demo is visible: '+motion);
            if(await road.locator('.road-demo-telemetry .road-telemetry-card').count()!==4)
              throw Error('Premium road demo must show 4 distinct telemetry panels');
            if(await road.locator('.road-demo-range-ring').count()!==3||
               await road.locator('.road-demo-flow-line').count()<2)
              throw Error('Radar rings or flowing lane guidance not present in roadway');
            if(await road.locator('[data-road-step]').count()!==4)
              throw Error('Premium road demo requires 4 actual modes');
            const baseHeight=await road.evaluate(el=>el.getBoundingClientRect().height);
            if(baseHeight<340||baseHeight>510)
              throw Error('Road demo frame height must remain compact: '+baseHeight);
            for(const [stage,needle] of [[1,'GPS'],[2,'REAR'],[3,'P'],[0,'REC']]){
              await road.locator('[data-road-step="'+stage+'"]').click();
              if(await road.getAttribute('data-road-stage')!==String(stage))
                throw Error('Road demo mode was not selected: '+stage);
              if(await road.locator('[data-road-step="'+stage+'"]').getAttribute('aria-pressed')!=='true')
                throw Error('Road demo mode lacks pressed state: '+stage);
              const actual=await road.locator('[data-road-hud]').innerText();
              if(!actual.includes(needle))
                throw Error('Road HUD was not updated for mode '+stage+': '+actual);
              const height=await road.evaluate(el=>el.getBoundingClientRect().height);
              if(Math.abs(height-baseHeight)>1)
                throw Error('Mode '+stage+' shifted fixed demo frame: '+height+' vs '+baseHeight);
            }
            await road.locator('[data-road-step="1"]').click();
            if(await road.getAttribute('data-road-stage')!=='1' ||
               !await road.evaluate(el=>el.classList.contains('is-overspeed')) ||
               await road.locator('[data-road-speed]').innerText()!=='72' ||
               await road.locator('[data-road-limit]').innerText()!=='60' ||
               !(await road.locator('[data-road-excess]').innerText()).includes('+12'))
              throw Error('GPS speed warning must show illustrative 72 km/h vs 60 km/h (+12)');
            const alert=road.locator('.road-demo-speed-warning');
            if(await alert.getAttribute('aria-hidden')!=='false')
              throw Error('GPS overspeed warning must be visible and accessible');
            await road.locator('[data-road-step="0"]').click();
            if(await road.evaluate(el=>el.classList.contains('is-overspeed')))
              throw Error('GPS-only overspeed alert leaked into plain record mode');
            await road.locator('[data-road-step="2"]').click();
            const split=await road.locator('.road-demo-rear-feed').evaluate(el=>getComputedStyle(el).visibility);
            if(split!=='visible')throw Error('Dual-camera mode must open inset rear view');
            await road.locator('[data-road-step="3"]').click();
            if(await road.locator('[data-road-speed]').innerText()!=='0')
              throw Error('Parked demo speed should display zero');
            if(await road.locator('.road-demo-parking-zones').count()!==1)
              throw Error('Parking demonstration sensor contours missing');
            if(await road.locator('.road-demo-route-beam').count()!==1)
              throw Error('GPS demonstration route beam missing');
            await road.locator('[data-road-step="0"]').click();
            for(const width of [320,390]){
              await page.setViewportSize({width,height:844});
              const r=await road.evaluate(el=>{
                const rect=el.getBoundingClientRect();
                return {left:rect.left,right:rect.right,height:rect.height,
                  viewport:document.documentElement.clientWidth};
              });
              if(r.left<0||r.right>r.viewport+1||r.height<345||r.height>455)
                throw Error('Premium road demo must fit '+width+'px mobile width: '+JSON.stringify(r));
              const hud=await road.locator('.road-demo-telemetry').evaluate(el=>getComputedStyle(el).position);
              if(hud!=='absolute')
                throw Error('Demo HUD must overlay the graphic, not reflow captions');
            }
            await page.setViewportSize({width:390,height:844});
            console.log('PREMIUM ROAD HUD PASS: radar, flow, 4 interactive modes, fixed frame and 320/390 mobile');
            const target=await page.locator('#openNewsMobile').evaluate(el=>({html:el.outerHTML,disabled:el.disabled}));
            console.log('NEWS TARGET '+JSON.stringify(target)+' before URL='+page.url());
            // The auto-hiding dock is intentionally hidden while scrolling down.
            // Restore it by scrolling UP before attempting a real mobile tap.
            await page.evaluate(()=>window.scrollTo({top:0,behavior:'instant'}));
            await page.waitForFunction(()=>document.querySelector('.mobile-nav')&&
              getComputedStyle(document.querySelector('.mobile-nav')).visibility!=='hidden',
              null,{timeout:8000});
            await page.waitForTimeout(450);
            await page.locator('#openNewsMobile').click();
            await page.waitForTimeout(1600);
            console.log('NEWS AFTER CLICK URL='+page.url());
            await page.waitForURL(url=>/\/news(?:\.html)?\/?$/.test(new URL(url).pathname),{timeout:15000});
            await page.waitForSelector('#newsGrid',{state:'attached',timeout:12000});
            // The video archive is built from actual YouTube IDs and the same
            // 30-day period as the road news (never placeholder stock imagery).
            const videos=page.locator('#newsVideoLibrary');
            if(!await videos.isVisible()||await page.locator('#newsVideoFilters .news-video-chip').count()!==7)
              throw Error('30-day official road-video library missing');
            const sourceLinks=await page.locator('.news-video-sources a').count();
            if(sourceLinks!==3)throw Error('Expected verified sources: 13 News, KAN News and Israel Police');
            await page.waitForFunction(()=>{
              const status=document.getElementById('newsVideoStatus');
              const count=document.getElementById('newsVideoCount');
              return status&&count&&count.textContent?.trim().length>1;
            },null,{timeout:16000});
            // Radar reports are their own monthly category, with verified
            // News 13 older clips presented in a SEPARATE labeled archive.
            for(const cat of ['dashcam','funny']){
              if(!await page.locator('#newsVideoFilters [data-video-cat="'+cat+'"]').isVisible())
                throw Error('YouTube community videos missing filter '+cat);
            }
            const radarFilter=page.locator('#newsVideoFilters [data-video-cat="radars"]');
            if(!await radarFilter.isVisible())throw Error('Radars/speed cameras filter missing');
            if(await page.locator('#newsVideoArchiveGrid .news-video-card').count()!==2)
              throw Error('The two verified older News 13 radar clips are not shown separately');
            await radarFilter.click();
            if(await page.locator('#newsVideoArchiveGrid .news-video-card').count()!==2)
              throw Error('Radar filter should retain the separately labeled News 13 archive');
            await page.locator('#newsVideoFilters [data-video-cat="all"]').click();
            const videoCards=page.locator('#newsVideoGrid .news-video-card');
            const firstVideoCount=await videoCards.count();
            if(firstVideoCount){
              const vid=await videoCards.first().getAttribute('data-video');
              if(!/^[a-zA-Z0-9_-]{11}$/.test(vid))
                throw Error('Video card must use an original YouTube video ID: '+vid);
              await videoCards.first().click();
              const iframe=page.locator('#newsVideoEmbed iframe');
              if(!await iframe.isVisible()||!(await iframe.getAttribute('src')).includes('youtube-nocookie.com/embed/'+vid))
                throw Error('Embedded video requires explicit click and authentic YouTube ID');
              if(!(await page.locator('#newsVideoExternal').getAttribute('href')).endsWith('watch?v='+vid))
                throw Error('Video player must link back to the actual publisher clip');
              await page.locator('#newsVideoClose').click();
              if(await page.locator('#newsVideoEmbed iframe').count())
                throw Error('Video iframe should unload when viewer closes');
            }
            for(const width of [320,390]){
              await page.setViewportSize({width,height:844});
              const dims=await videos.evaluate(el=>({
                width:el.getBoundingClientRect().width,
                scroll:document.documentElement.scrollWidth,
                screen:document.documentElement.clientWidth
              }));
              if(dims.scroll>dims.screen+3)
                throw Error('Video library created horizontal mobile overflow at '+width+'px: '+JSON.stringify(dims));
            }
            await page.setViewportSize({width:390,height:844});
            console.log('ROAD VIDEO LIBRARY PASS: real publisher links, 30-day filter, 320/390px layout, mobile player');
            // Catch HTML regressions where one missing quote disables both
            // the stylesheet and the news script on Android browsers.
            const assetState=await page.evaluate(()=>{
              const css=[...document.querySelectorAll('link[rel=stylesheet]')].find(e=>e.href.includes('news-ui.css'));
              const js=[...document.scripts].find(e=>e.src.includes('news-ui.js'));
              const style=getComputedStyle(document.body);
              return {css:css?.href||'',js:js?.src||'',bodyFont:style.fontFamily,
                bodyMargin:style.marginLeft,logoWidth:document.querySelector('.news-logo img')?.getBoundingClientRect().width,
                activeCards:document.querySelectorAll('.news-card').length};
            });
            if(!assetState.css||!assetState.js||assetState.bodyMargin!=='0px'||assetState.logoWidth>250)
              throw Error('News CSS or JavaScript did not load: '+JSON.stringify(assetState));
            if(!/news-ui/.test(assetState.css)||!/news-ui/.test(assetState.js))
              throw Error('News stylesheet/script tag malformed: '+JSON.stringify(assetState));
            const cssFetch=await page.request.get(assetState.css),jsFetch=await page.request.get(assetState.js);
            if(!cssFetch.ok()||!jsFetch.ok())throw Error('News assets are not available: '+cssFetch.status()+' / '+jsFetch.status());
            if(!(await cssFetch.text()).includes('.news-cover')||!(await jsFetch.text()).includes('initializeFeatures'))
              throw Error('News asset URLs returned incorrect content or HTML fallbacks');
            console.log('NEWS ASSET LOAD PASS '+JSON.stringify(assetState));
            if(await page.locator('#newsFav').count()!==0||await page.locator('#newsDelivery').count()!==1)
              throw Error('News bottom nav should replace Favorites with Delivery');
            const compact=await page.evaluate(()=>{
              const bounds=id=>document.getElementById(id).getBoundingClientRect();
              return {titleBottom:bounds('newsHeading').bottom,chartTop:bounds('accidentStrip').top,
               chartBottom:bounds('accidentStrip').bottom,carouselTop:bounds('newsFeatureCarousel').top,
               languageTop:bounds('newsLanguages').top,headerBottom:document.querySelector('.news-header').getBoundingClientRect().bottom,
               intro:getComputedStyle(document.getElementById('newsIntro')).display,
               stats:getComputedStyle(document.querySelector('.news-fresh-row')).display,
               gameTab:!!document.getElementById('newsGame')};
            });
            if(compact.intro!=='none'||compact.stats!=='none')
              throw Error('Old news intro remains visible: '+JSON.stringify(compact));
            if(compact.languageTop>=compact.headerBottom||!compact.gameTab)
              throw Error('Header language tabs or fifth game icon missing: '+JSON.stringify(compact));
            if(compact.chartTop<compact.titleBottom-4||compact.carouselTop<compact.chartBottom-4)
              throw Error('30-day news chart must be visible between title and carousel: '+JSON.stringify(compact));
            const chartSize=await page.locator('#accidentChart').evaluate(el=>({
              height:el.getBoundingClientRect().height,
              dayRows:el.querySelectorAll('.accident-day').length
            }));
            if(chartSize.height<165)
              throw Error('Mobile monthly accident graph is too compressed: '+JSON.stringify(chartSize));
            console.log('CHART-FIRST NEWS HERO PASS '+JSON.stringify(compact));
            await page.waitForFunction(()=>document.querySelectorAll('.news-card').length>0 || !document.getElementById('newsEmpty').hidden,{timeout:30000});
            const data=await page.evaluate(async()=>await (await fetch('./assets/news/news.json')).json());
            if(data.version!==1||data.retentionDays!==30||data.lawsRetentionMonths!==6)throw Error('Wrong archive configuration');
            const carousel=page.locator('#newsFeatureCarousel');
            await page.waitForFunction(()=>document.querySelectorAll('.news-feature-dot').length===10,{timeout:15000});
            if(!await carousel.isVisible())throw Error('Top ten-news carousel is hidden');
            const firstFeature=await carousel.locator('.news-feature-title').innerText();
            if(await carousel.locator('img,picture').count())
              throw Error('No news story photos in broadcast slider');
            const corners=carousel.locator('#newsFeatureSlide .news-studio-corners');
            if(await corners.count()!==1)
              throw Error('Static cyan news corners must always be present');
            const fixedCorners=await corners.evaluate(el=>{
              const upper=getComputedStyle(el,'::before');
              const lower=getComputedStyle(el,'::after');
              return {
                topClip:upper.clipPath,lowerClip:lower.clipPath,
                upperAnimation:upper.animationName,lowerAnimation:lower.animationName,
                upperColor:upper.backgroundImage,lowerColor:lower.backgroundImage
              };
            });
            if(!fixedCorners.topClip.includes('polygon')||!fixedCorners.lowerClip.includes('polygon')||
               fixedCorners.upperAnimation!=='none'||fixedCorners.lowerAnimation!=='none'||
               !fixedCorners.upperColor.includes('linear-gradient')||!fixedCorners.lowerColor.includes('linear-gradient'))
              throw Error('The original corners must stay colored and motionless: '+JSON.stringify(fixedCorners));
            const dotGrid=await corners.evaluate(el=>{
              const upper=el.querySelector('.news-studio-dots--top');
              const lower=el.querySelector('.news-studio-dots--bottom');
              const topDots=[...upper.querySelectorAll('.news-studio-dot')];
              const bottomDots=[...lower.querySelectorAll('.news-studio-dot')];
              const topStyles=topDots.map(n=>getComputedStyle(n));
              const lowStyles=bottomDots.map(n=>getComputedStyle(n));
              const spacing=(Number.parseFloat(topStyles[1]?.left)-Number.parseFloat(topStyles[0]?.left));
              return {
                upperCount:topDots.length,bottomCount:bottomDots.length,
                gridsStationary:getComputedStyle(upper).animationName==='none'&&getComputedStyle(lower).animationName==='none',
                sameMirror:topDots.every((n,i)=>{
                  const top=getComputedStyle(n),low=lowStyles[i];
                  return top.width===low.width&&top.height===low.height&&
                   top.left===low.right&&top.top===low.bottom&&top.opacity===low.opacity;
                }),
                spacing,firstSize:Number.parseFloat(topStyles[0]?.width),
                smallestSize:Math.min(...topStyles.map(x=>Number.parseFloat(x.width))),
                background:getComputedStyle(upper).backgroundImage,
                topMask:getComputedStyle(upper).clipPath,
                bottomMask:getComputedStyle(lower).clipPath
              };
            });
            if(dotGrid.upperCount<24||dotGrid.upperCount!==dotGrid.bottomCount||
               !dotGrid.gridsStationary||!dotGrid.sameMirror||
               dotGrid.spacing<14||dotGrid.spacing>21||
               dotGrid.firstSize-dotGrid.smallestSize<3.5||
               dotGrid.smallestSize>2.5||
               dotGrid.background!=='none'||
               !dotGrid.topMask.includes('polygon')||!dotGrid.bottomMask.includes('polygon'))
              throw Error('Halftone corners need one dense, symmetric wave of graduated dots: '+JSON.stringify(dotGrid));
            const edges=await corners.locator('.news-studio-edges').evaluate(el=>({
              paths:[...el.querySelectorAll('path')].map(p=>({
                path:p.getAttribute('d'),
                stroke:getComputedStyle(p).stroke,
                width:Number.parseFloat(getComputedStyle(p).strokeWidth),
                opacity:Number.parseFloat(getComputedStyle(p).strokeOpacity)
              })),
              motion:getComputedStyle(el).animationName,
              mirror:el.getAttribute('preserveAspectRatio')
            }));
            if(edges.paths.length!==2||
               edges.paths[0].path!=='M42.4 0 L0 53.4'||
               edges.paths[1].path!=='M100 46.6 L57.6 100'||
               edges.paths.some(x=>x.width<1.5||x.width>2.5||x.opacity>.8)||
               edges.motion!=='none'||edges.mirror!=='none')
              throw Error('Both corner diagonals need restrained matching static dark edges: '+JSON.stringify(edges));
            await corners.evaluate(el=>{el.dataset.fixedCorners='original'});
            const pearl=await carousel.locator('.news-broadcast-stage').evaluate(el=>({
              glows:getComputedStyle(el,'::before').animationName,
              sweep:getComputedStyle(el,'::after').animationName,
              layers:el.querySelectorAll('.news-mask-accent').length
            }));
            if(!pearl.glows.includes('newsPearlStudioFloat')||!pearl.sweep.includes('newsPearlStudioWave'))
              throw Error('The white-blue studio light must float vertically and horizontally: '+JSON.stringify(pearl));
            const foreground=carousel.locator('.news-broadcast-foreground');
            const theme=await page.locator('#newsFeatureSlide').getAttribute('data-news-theme');
            if(!['accidents','laws','speed','roads','cars'].includes(theme))
              throw Error('News article has no valid category color: '+theme);
            // Neither text nor URL may be contained inside any background mask.
            if(await carousel.locator('.news-broadcast-stage .news-feature-title').count())
              throw Error('News text was duplicated inside a background mask');
            const masks=['ribbons','chevron','shutters','diagonal','diamond'];
            for(let i=0;i<masks.length;i++){
              const effect=masks[i];
              await page.locator('#newsFeatureNext').click();
              if(await carousel.locator('.news-broadcast-stage .news-feature-title').count())
                throw Error(effect+' background transition contains duplicate text');
              if(await foreground.count()!==1)
                throw Error('Foreground link was remounted during '+effect);
              if(await corners.count()!==1||await corners.getAttribute('data-fixed-corners')!=='original')
                throw Error('Stationary corner decorations were replaced during '+effect);
              if(await carousel.locator('.news-copy-enter').count()!==1)
                throw Error('New title should fade in separately during '+effect);
              const accents=carousel.locator('.news-mask-accent');
              if(await accents.count()!==3)throw Error('Expected three colored mask bands during '+effect);
              const stripe=await accents.first().evaluate(el=>({
                animation:getComputedStyle(el).animationName,
                background:getComputedStyle(el).backgroundImage
              }));
              if(!stripe.animation.includes('newsAccentSweep')||!stripe.background.includes('linear-gradient'))
                throw Error('Colored accent strips not applied: '+JSON.stringify(stripe));
              if(effect==='ribbons'||effect==='shutters'){
                const segments=carousel.locator('.news-bg-fragment--'+effect);
                if(await segments.count()!==5)
                  throw Error(effect+' must mask five strips of the BACKGROUND only');
                const testSegment=await segments.nth(2).evaluate(el=>({
                  animation:getComputedStyle(el).animationName,
                  clip:getComputedStyle(el).clipPath,
                  containsText:!!el.querySelector('.news-feature-title')
                }));
                if(!testSegment.animation.includes('newsBgStripFrom')||testSegment.clip==='none'||testSegment.containsText)
                  throw Error('Masked background fragment invalid: '+JSON.stringify(testSegment));
              }else{
                const layer=carousel.locator('.news-bg-wipe--'+effect);
                if(await layer.count()!==1)
                  throw Error('Background geometric mask '+effect+' missing');
                const animation=await layer.evaluate(el=>getComputedStyle(el).animationName);
                if(!animation.includes(effect==='diamond'?'newsBgDiamond':
                  effect==='chevron'?'newsBgChevron':'newsBgDiagonal'))
                  throw Error('Background '+effect+' has no mask animation');
              }
              await page.waitForTimeout(1120);
              if(await carousel.locator('.news-bg-layer').count()!==1 ||
                 await carousel.locator('.news-mask-accent').count())
                throw Error(effect+' left stray background layers or stripes');
              if(await carousel.locator('.news-feature-title').count()!==1)
                throw Error(effect+' left an old headline in the foreground');
            }
            if(await carousel.locator('.news-feature-title').innerText()===firstFeature)
              throw Error('Broadcast transitions did not change news story');
            const counter=await page.locator('#newsFeatureCounter').textContent();
            if(!/06\s*\/\s*10/.test(counter))
              throw Error('Wrong current slide after five transitions: '+counter);
            await page.locator('#newsFeaturePrev').click();
            if(await carousel.locator('.news-bg-fragment--ribbons.news-bg-from-prev').count()!==5)
              throw Error('Reverse diagonal ribbons did not move in opposite direction');
            await page.locator('#newsFeatureNext').click();
            await page.waitForTimeout(1120);
            if(await carousel.locator('.news-bg-layer').count()!==1 ||
               await carousel.locator('.news-feature-title').count()!==1)
              throw Error('Rapid taps left orphaned masks or headlines');
            // Headline slider retains the existing compact mobile geometry.
            const geometry=await page.evaluate(()=>{
              const hero=document.querySelector('.news-feature-slide').getBoundingClientRect();
              const card=document.querySelector('.news-card').getBoundingClientRect();
              const frame=document.querySelector('.news-feature-carousel').getBoundingClientRect();
              const deco=document.querySelector('.news-feature-blueprint');
              return {heroWidth:hero.width,cardWidth:card.width,heroHeight:hero.height,
               frameWidth:frame.width,decoration:!!deco};
            });
            if(!geometry.decoration)
              throw Error('NEOLINE slide accents missing: '+JSON.stringify(geometry));
            if(Math.abs(geometry.heroWidth-geometry.cardWidth)>4)
              throw Error('Carousel must align with headline list: '+JSON.stringify(geometry));
            if(Math.abs(geometry.heroHeight-245)>2)
              throw Error('Carousel mobile image height changed unexpectedly: '+JSON.stringify(geometry));
            console.log('ANIMATED NEWS BACKDROP PASS: image-free and mobile image height retained '+JSON.stringify(geometry));
            console.log('FEATURE CAROUSEL PASS: 5 background-only masks, colored diagonal accents, independent news headline');
            const now=Date.now(),limit=now-30*86400*1000;
            const cutoff=new Date(now),day=cutoff.getUTCDate();
            cutoff.setUTCDate(1);cutoff.setUTCMonth(cutoff.getUTCMonth()-6);
            const lastDay=new Date(Date.UTC(cutoff.getUTCFullYear(),cutoff.getUTCMonth()+1,0)).getUTCDate();
            cutoff.setUTCDate(Math.min(day,lastDay));
            // The source file updates once a day. An item can expire between the
            // daily build and this browser check; the client must filter it immediately.
            const grace=86400*1000;
            if(data.items.some(x=>Date.parse(x.date)<(x.category==='laws'?cutoff.getTime()-grace:limit-grace)))
              throw Error('News file exceeds the one-day scheduled-refresh grace period');
            if(!data.items.some(x=>x.category==='laws'&&Date.parse(x.date)<limit))
              throw Error('No older verified six-month rules in archive');
            if(data.items.some(x=>/news\.google\.com|google\.com\/sorry/.test(x.url)))throw Error('Google redirects are not direct publisher links');
            if(data.items.some(x=>!x.translations))throw Error('Missing language fields');
            for(const article of data.items){
              for(const lang of ['ru','he','en','ar']){
                if(!article.translations[lang]?.title||!article.translations[lang]?.summary)
                  throw Error('Translation missing for '+article.id+' / '+lang);
              }
              if(article.image){
                const picture=await page.request.get(new URL(article.image,page.url()).href);
                if(!picture.ok())throw Error('Thumbnail URL not published: '+article.image+' / '+picture.status());
                if(article.image.endsWith('.webp')&&(await picture.body()).length>=90_000)
                  throw Error('Thumbnail exceeds 90 KB: '+article.image);
              }
            }
            const firstOrder=await page.locator('#newsCategories button').evaluateAll(els=>els.map(el=>el.dataset.newsCategory));
            if(firstOrder.indexOf('laws')>firstOrder.indexOf('speed'))throw Error('Rules and laws must precede Speed');
            await page.locator('button[data-news-category="laws"]').click();
            const lawsPeriod=await page.locator('#newsRetention').textContent();
            if(!/6/.test(lawsPeriod))throw Error('Six-month laws archive badge missing: '+lawsPeriod);
            const lawCards=await page.locator('.news-card').count();
            if(lawCards<4)throw Error('Six-month laws backlog not displayed: '+lawCards);
            await page.locator('button[data-news-category="all"]').click();
            const cards=await page.locator('.news-card').count();
            const expectedFirst=Math.min(8,data.items.length);
            if(cards!==expectedFirst)throw Error('Initial lazy batch wrong: cards='+cards+', first='+expectedFirst+', feed='+data.items.length);
            if(data.items.length>8){
              // Scrolling must never append news automatically; only the button does.
              await page.evaluate(()=>window.scrollTo(0,document.body.scrollHeight));
              await page.waitForTimeout(700);
              const stillEight=await page.locator('.news-card').count();
              if(stillEight!==cards)throw Error('News auto-loaded without explicit click: '+cards+' -> '+stillEight);
              await page.locator('#newsMoreButton').click();
              const next=await page.locator('.news-card').count();
              if(next<=cards||next>cards+8)throw Error('Click-based news pagination broken '+cards+' -> '+next);
              console.log('NEWS FIRST 8 AND BUTTON PASS '+cards+' -> '+next);
            }
            if(cards){
             if(await page.locator('.news-card img, .news-card picture, .news-card .news-art, .news-card .news-photo-placeholder').count())
               throw Error('Headline news list must not contain pictures or repeated photo captions');
             const link=await page.locator('.news-card .news-title-button').first().getAttribute('href');
             if(!link||!link.startsWith('http'))throw Error('News item has no valid source link');
            }
            // Individual accordions were intentionally removed: the expand button
            // applies to the entire feed, and each headline links to its publisher.
            if(await page.locator('.news-card details.news-expand').count()!==0)
              throw Error('Per-article accordion should not be present');
            const headlines=page.locator('.news-card a.news-title-button');
            if(await headlines.count()<cards)throw Error('A news headline lost its publisher link');
            const headlineHref=await headlines.first().getAttribute('href');
            if(!headlineHref||!headlineHref.startsWith('https://'))
              throw Error('News headline does not link to the original publisher');
            if(await headlines.first().getAttribute('target')!=='_blank')
              throw Error('News headlines should open the publisher in a new tab');
            console.log('NEWS CLICK-THROUGH PASS');
            const languages=await page.locator('[data-news-lang]').count();
            if(languages!==4)throw Error('Four-language news selection missing');
            for(const code of ['he','en','ar','ru']){
             await page.locator('[data-news-lang="'+code+'"]').click();
             if(await page.locator('html').getAttribute('lang')!==code)throw Error('News locale switch broken: '+code);
            }
            const bottom=await page.locator('.news-bottom>a').count();
            if(bottom!==5)throw Error('News page has wrong navigation button count');
            for(const width of [320,390]){
             await page.setViewportSize({width,height:844});
             const dims=await page.evaluate(()=>({scroll:document.documentElement.scrollWidth,window:window.innerWidth}));
             if(dims.scroll>dims.window+3)throw Error('Mobile news horizontal overflow '+JSON.stringify(dims));
            }
            const old={id:'obsolete',title:'Expired test story',date:'2026-01-01T06:00:00Z',category:'cars',art:'cars',summary:'old',publisher:'Test',url:'https://example.com'};
            await page.route('**/assets/news/news.json',route=>route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({version:1,retentionDays:30,lawsRetentionMonths:6,updated:new Date().toISOString(),items:[old]})}));
            await page.reload({waitUntil:'domcontentloaded'});
            await page.waitForTimeout(600);
            // The page intentionally falls back to a fresher GitHub feed when the
            // Pages source is missing or stale. Therefore current stories may
            // still be visible; only the injected expired story must be absent.
            const renderedExpired=await page.locator('.news-card').filter({hasText:'Expired test story'}).count();
            if(renderedExpired!==0)throw Error('Expired article leaked into news feed');
            if(errors.length)throw Error('JS page errors: '+errors.join(' | '));
            console.log('NEWS MOBILE PASS tabs='+tabs+' currentItems='+cards+' expiredRendered='+renderedExpired+' noHorizontalScroll=true JSerrors=0');
            await page.locator('#newsDelivery').click();
            await page.waitForURL(url=>/\/delivery(?:\.html)?\/?$/.test(new URL(url).pathname),{timeout:15000});
            console.log('NEWS DELIVERY LINK PASS');
            await page.goto('https://neoline-israel.pages.dev/delivery.html',{waitUntil:'domcontentloaded',timeout:40000});
            // The compact locator keeps networks in a modal sheet, not the
            // formerly visible desktop sidebar. Open the real control first.
            await page.locator('#locatorNetworksButton').waitFor({state:'visible',timeout:15000});
            await page.locator('#locatorNetworksButton').click();
            await page.locator('#locatorDialog').waitFor({state:'visible'});
            await page.locator('.network[data-provider="boxit"]').waitFor({state:'visible'});
            const colors=await page.evaluate(()=>({
              scheme:getComputedStyle(document.documentElement).colorScheme,
              card:getComputedStyle(document.querySelector('#locatorDialog')).backgroundColor,
              background:getComputedStyle(document.body).backgroundImage
            }));
            if(colors.scheme!=='light'||colors.card!=='rgb(255, 255, 255)'||!/245|255/.test(colors.background))
              throw Error('Pickup locator must use light NEOLINE colors '+JSON.stringify(colors));
            await page.locator('.network[data-provider="done"]').click();
            if(await page.locator('.network[data-provider="done"]').getAttribute('aria-pressed')!=='true')
              throw Error('Pickup network selection not working');
            if(await page.locator('#locatorDialog').isVisible())
              throw Error('Network selection should close the locator sheet');
            for(const width of [320,390]){
              await page.setViewportSize({width,height:844});
              const dims=await page.evaluate(()=>({scroll:document.documentElement.scrollWidth,width:innerWidth}));
              if(dims.scroll>dims.width+3)throw Error('Pickup mobile overflow '+JSON.stringify(dims));
            }
            if(errors.length)throw Error('Delivery JS page errors: '+errors.join(' | '));
            console.log('PICKUP LIGHT THEME PASS');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
