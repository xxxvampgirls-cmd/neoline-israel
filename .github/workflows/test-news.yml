name: Browser-check Israel auto-news and 30-day expiry
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "news.html"
      - "news-ui.js"
      - "news-ui.css"
      - "news-accidents.js"
      - "news-accidents.css"
      - "news-layout-polish.css"
      - "nav-current.js"
      - "hot.html"
      - "teoria.html"
      - "catalog-ui.css"
      - "catalog-ui.js"
      - "index.html"
      - "delivery.html"
      - "pickup-ui.css"
      - ".github/workflows/test-news.yml"
permissions:
  contents: read
jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Prepare Chromium
        run: |
          npm install --no-save playwright
          npx playwright install chromium
      - name: Check real published mobile news
        run: |
          node <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const errors=[];
            const page=await browser.newPage({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
            page.on('pageerror',e=>errors.push(e.message));
            await page.goto('https://neoline-israel.pages.dev/',{waitUntil:'domcontentloaded',timeout:40000});
            await page.waitForTimeout(800);
            await page.waitForFunction(()=>document.querySelectorAll('#products .product').length===8,{timeout:35000});
            const productsInitially=await page.locator('#products .product').count();
            if(productsInitially!==8)throw Error('Main catalog must show exactly 8 products initially, got '+productsInitially);
            await page.locator('#catalogShowMoreBtn').click();
            await page.waitForFunction(()=>document.querySelectorAll('#products .product').length===16,{timeout:10000});
            console.log('PRODUCT FIRST 8 PASS: 8 -> 16');
            const tabs=await page.locator('.mobile-nav>button, .mobile-nav>a').count();
            if(tabs!==5)throw Error('Expected five mobile navigation controls, got '+tabs);
            const deliveryTab=page.locator('#mobileDelivery');
            if(!await deliveryTab.isVisible()||!String(await deliveryTab.getAttribute('href')).endsWith('/delivery.html'))
              throw Error('Delivery tab missing from homepage bottom navigation');
            if(await page.locator('#mobileFav, #desktopFav, .product .heart').count())
              throw Error('Favorites/heart control still shown');
            if(await page.locator('#desktopDelivery').count()!==1)
              throw Error('Desktop delivery shortcut missing');
            console.log('HOMEPAGE DELIVERY NAV PASS: no favorites, truck link available');
            const target=await page.locator('#openNewsMobile').evaluate(el=>({html:el.outerHTML,disabled:el.disabled}));
            console.log('NEWS TARGET '+JSON.stringify(target)+' before URL='+page.url());
            // The auto-hiding dock is intentionally hidden while scrolling down.
            // Restore it by scrolling UP before attempting a real mobile tap.
            await page.evaluate(()=>window.scrollTo({top:0,behavior:'instant'}));
            await page.waitForFunction(()=>document.querySelector('.mobile-nav')&&
              getComputedStyle(document.querySelector('.mobile-nav')).visibility!=='hidden',
              null,{timeout:8000});
            await page.waitForTimeout(450);
            await page.locator('#openNewsMobile').click();
            await page.waitForTimeout(1600);
            console.log('NEWS AFTER CLICK URL='+page.url());
            await page.waitForURL(url=>/\/news(?:\.html)?\/?$/.test(new URL(url).pathname),{timeout:15000});
            await page.waitForSelector('#newsGrid',{state:'attached',timeout:12000});
            // Catch HTML regressions where one missing quote disables both
            // the stylesheet and the news script on Android browsers.
            const assetState=await page.evaluate(()=>{
              const css=[...document.querySelectorAll('link[rel=stylesheet]')].find(e=>e.href.includes('news-ui.css'));
              const js=[...document.scripts].find(e=>e.src.includes('news-ui.js'));
              const style=getComputedStyle(document.body);
              return {css:css?.href||'',js:js?.src||'',bodyFont:style.fontFamily,
                bodyMargin:style.marginLeft,logoWidth:document.querySelector('.news-logo img')?.getBoundingClientRect().width,
                activeCards:document.querySelectorAll('.news-card').length};
            });
            if(!assetState.css||!assetState.js||assetState.bodyMargin!=='0px'||assetState.logoWidth>250)
              throw Error('News CSS or JavaScript did not load: '+JSON.stringify(assetState));
            if(!/news-ui/.test(assetState.css)||!/news-ui/.test(assetState.js))
              throw Error('News stylesheet/script tag malformed: '+JSON.stringify(assetState));
            const cssFetch=await page.request.get(assetState.css),jsFetch=await page.request.get(assetState.js);
            if(!cssFetch.ok()||!jsFetch.ok())throw Error('News assets are not available: '+cssFetch.status()+' / '+jsFetch.status());
            if(!(await cssFetch.text()).includes('.news-cover')||!(await jsFetch.text()).includes('initializeFeatures'))
              throw Error('News asset URLs returned incorrect content or HTML fallbacks');
            console.log('NEWS ASSET LOAD PASS '+JSON.stringify(assetState));
            if(await page.locator('#newsFav').count()!==0||await page.locator('#newsDelivery').count()!==1)
              throw Error('News bottom nav should replace Favorites with Delivery');
            const compact=await page.evaluate(()=>{
              const bounds=id=>document.getElementById(id).getBoundingClientRect();
              return {titleBottom:bounds('newsHeading').bottom,chartTop:bounds('accidentStrip').top,
               chartBottom:bounds('accidentStrip').bottom,carouselTop:bounds('newsFeatureCarousel').top,
               languageTop:bounds('newsLanguages').top,headerBottom:document.querySelector('.news-header').getBoundingClientRect().bottom,
               intro:getComputedStyle(document.getElementById('newsIntro')).display,
               stats:getComputedStyle(document.querySelector('.news-fresh-row')).display,
               gameTab:!!document.getElementById('newsGame')};
            });
            if(compact.intro!=='none'||compact.stats!=='none')
              throw Error('Old news intro remains visible: '+JSON.stringify(compact));
            if(compact.languageTop>=compact.headerBottom||!compact.gameTab)
              throw Error('Header language tabs or fifth game icon missing: '+JSON.stringify(compact));
            if(compact.chartTop<compact.titleBottom-4||compact.carouselTop<compact.chartBottom-4)
              throw Error('30-day news chart must be visible between title and carousel: '+JSON.stringify(compact));
            console.log('CHART-FIRST NEWS HERO PASS '+JSON.stringify(compact));
            await page.waitForFunction(()=>document.querySelectorAll('.news-card').length>0 || !document.getElementById('newsEmpty').hidden,{timeout:30000});
            const data=await page.evaluate(async()=>await (await fetch('./assets/news/news.json')).json());
            if(data.version!==1||data.retentionDays!==30||data.lawsRetentionMonths!==6)throw Error('Wrong archive configuration');
            const carousel=page.locator('#newsFeatureCarousel');
            await page.waitForFunction(()=>document.querySelectorAll('.news-feature-dot').length===10,{timeout:15000});
            if(!await carousel.isVisible())throw Error('Top ten-news carousel is hidden');
            const firstFeature=await carousel.locator('.news-feature-title').innerText();
            if(await carousel.locator('img,picture').count())
              throw Error('News studio slider should never contain photographs');
            const firstTheme=await page.locator('.news-scene--current').getAttribute('data-news-theme');
            if(!['accidents','laws','speed','roads','cars'].includes(firstTheme))
              throw Error('News category palette invalid: '+firstTheme);
            const masks=['ribbons','chevron','shutters','diagonal','diamond'];
            for(let i=0;i<masks.length;i++){
              const mask=masks[i];
              await page.locator('#newsFeatureNext').click();
              const scene=carousel.locator('.news-scene--current');
              if(!['accidents','laws','speed','roads','cars'].includes(await scene.getAttribute('data-news-theme')))
                throw Error('Incoming frame lost category palette in '+mask);
              if(mask==='ribbons'||mask==='shutters'){
                const pieces=carousel.locator('.news-scene--fragment-'+mask);
                if(await pieces.count()!==5)
                  throw Error(mask+' must contain five fully masked fragments of the new frame');
                const cut=await pieces.nth(2).evaluate(el=>({
                  animation:getComputedStyle(el).animationName,
                  clip:getComputedStyle(el).clipPath,
                  copy:!!el.querySelector('.news-feature-title'),
                  background:!!el.querySelector('.news-feature-backdrop')
                }));
                if(!cut.animation.includes('neolineMaskStripFrom')||cut.clip==='none'||!cut.copy||!cut.background)
                  throw Error(mask+' is not masking a whole incoming news scene: '+JSON.stringify(cut));
              }else{
                const wipe=carousel.locator('.news-scene--wipe-'+mask);
                if(await wipe.count()!==1)
                  throw Error('Expected a distinct full-scene '+mask+' news mask');
                const animation=await wipe.evaluate(el=>getComputedStyle(el).animationName);
                if(!animation.includes(mask==='diamond'?'neolineMaskDiamond':
                    mask==='chevron'?'neolineMaskChevron':'neolineMaskDiagonal'))
                  throw Error(mask+' animation missing: '+animation);
              }
              await page.waitForTimeout(1020);
              if(await carousel.locator('.news-scene').count()!==1)
                throw Error('Stale scenes or mask fragments remain after '+mask);
              if(await carousel.locator('img,picture').count())
                throw Error(mask+' injected an unrelated image');
            }
            const currentFeature=await carousel.locator('.news-feature-title').innerText();
            if(currentFeature===firstFeature)throw Error('Five transitions did not change the headline');
            const counter=await page.locator('#newsFeatureCounter').textContent();
            if(!/06\s*\/\s*10/.test(counter))
              throw Error('Wrong 6/10 slide position after mask series: '+counter);
            // Backward transition must reverse the mask direction, and interrupted
            // masks may not leave behind extra frames or focusable duplicate links.
            await page.locator('#newsFeaturePrev').click();
            if(await carousel.locator('.news-scene--fragment-ribbons.news-scene--from-prev').count()!==5)
              throw Error('Reverse news transition did not mirror ribbon direction');
            await page.locator('#newsFeatureNext').click();
            await page.waitForTimeout(1030);
            if(await carousel.locator('.news-scene').count()!==1)
              throw Error('Rapid taps left stale mask fragments in the DOM');
            const finalCounter=await page.locator('#newsFeatureCounter').textContent();
            if(!/06\s*\/\s*10/.test(finalCounter))
              throw Error('Carousel position changed after rapid prev/next');
            // Headline slider retains the existing compact mobile geometry.
            const geometry=await page.evaluate(()=>{
              const hero=document.querySelector('.news-feature-slide').getBoundingClientRect();
              const card=document.querySelector('.news-card').getBoundingClientRect();
              const frame=document.querySelector('.news-feature-carousel').getBoundingClientRect();
              const deco=document.querySelector('.news-feature-blueprint');
              return {heroWidth:hero.width,cardWidth:card.width,heroHeight:hero.height,
               frameWidth:frame.width,decoration:!!deco};
            });
            if(!geometry.decoration)
              throw Error('NEOLINE slide accents missing: '+JSON.stringify(geometry));
            if(Math.abs(geometry.heroWidth-geometry.cardWidth)>4)
              throw Error('Carousel must align with headline list: '+JSON.stringify(geometry));
            if(Math.abs(geometry.heroHeight-245)>2)
              throw Error('Carousel mobile image height changed unexpectedly: '+JSON.stringify(geometry));
            console.log('ANIMATED NEWS BACKDROP PASS: image-free and mobile image height retained '+JSON.stringify(geometry));
            console.log('FEATURE CAROUSEL PASS: diagonal, ribbon, chevron, shutters, diamond news-scene masks; image-free category palettes');
            const now=Date.now(),limit=now-30*86400*1000;
            const cutoff=new Date(now),day=cutoff.getUTCDate();
            cutoff.setUTCDate(1);cutoff.setUTCMonth(cutoff.getUTCMonth()-6);
            const lastDay=new Date(Date.UTC(cutoff.getUTCFullYear(),cutoff.getUTCMonth()+1,0)).getUTCDate();
            cutoff.setUTCDate(Math.min(day,lastDay));
            // The source file updates once a day. An item can expire between the
            // daily build and this browser check; the client must filter it immediately.
            const grace=86400*1000;
            if(data.items.some(x=>Date.parse(x.date)<(x.category==='laws'?cutoff.getTime()-grace:limit-grace)))
              throw Error('News file exceeds the one-day scheduled-refresh grace period');
            if(!data.items.some(x=>x.category==='laws'&&Date.parse(x.date)<limit))
              throw Error('No older verified six-month rules in archive');
            if(data.items.some(x=>/news\.google\.com|google\.com\/sorry/.test(x.url)))throw Error('Google redirects are not direct publisher links');
            if(data.items.some(x=>!x.translations))throw Error('Missing language fields');
            for(const article of data.items){
              for(const lang of ['ru','he','en','ar']){
                if(!article.translations[lang]?.title||!article.translations[lang]?.summary)
                  throw Error('Translation missing for '+article.id+' / '+lang);
              }
              if(article.image){
                const picture=await page.request.get(new URL(article.image,page.url()).href);
                if(!picture.ok())throw Error('Thumbnail URL not published: '+article.image+' / '+picture.status());
                if(article.image.endsWith('.webp')&&(await picture.body()).length>=90_000)
                  throw Error('Thumbnail exceeds 90 KB: '+article.image);
              }
            }
            const firstOrder=await page.locator('#newsCategories button').evaluateAll(els=>els.map(el=>el.dataset.newsCategory));
            if(firstOrder.indexOf('laws')>firstOrder.indexOf('speed'))throw Error('Rules and laws must precede Speed');
            await page.locator('button[data-news-category="laws"]').click();
            const lawsPeriod=await page.locator('#newsRetention').textContent();
            if(!/6/.test(lawsPeriod))throw Error('Six-month laws archive badge missing: '+lawsPeriod);
            const lawCards=await page.locator('.news-card').count();
            if(lawCards<4)throw Error('Six-month laws backlog not displayed: '+lawCards);
            await page.locator('button[data-news-category="all"]').click();
            const cards=await page.locator('.news-card').count();
            const expectedFirst=Math.min(8,data.items.length);
            if(cards!==expectedFirst)throw Error('Initial lazy batch wrong: cards='+cards+', first='+expectedFirst+', feed='+data.items.length);
            if(data.items.length>8){
              // Scrolling must never append news automatically; only the button does.
              await page.evaluate(()=>window.scrollTo(0,document.body.scrollHeight));
              await page.waitForTimeout(700);
              const stillEight=await page.locator('.news-card').count();
              if(stillEight!==cards)throw Error('News auto-loaded without explicit click: '+cards+' -> '+stillEight);
              await page.locator('#newsMoreButton').click();
              const next=await page.locator('.news-card').count();
              if(next<=cards||next>cards+8)throw Error('Click-based news pagination broken '+cards+' -> '+next);
              console.log('NEWS FIRST 8 AND BUTTON PASS '+cards+' -> '+next);
            }
            if(cards){
             if(await page.locator('.news-card img, .news-card picture, .news-card .news-art, .news-card .news-photo-placeholder').count())
               throw Error('Headline news list must not contain pictures or repeated photo captions');
             const link=await page.locator('.news-card .news-title-button').first().getAttribute('href');
             if(!link||!link.startsWith('http'))throw Error('News item has no valid source link');
            }
            // Individual accordions were intentionally removed: the expand button
            // applies to the entire feed, and each headline links to its publisher.
            if(await page.locator('.news-card details.news-expand').count()!==0)
              throw Error('Per-article accordion should not be present');
            const headlines=page.locator('.news-card a.news-title-button');
            if(await headlines.count()<cards)throw Error('A news headline lost its publisher link');
            const headlineHref=await headlines.first().getAttribute('href');
            if(!headlineHref||!headlineHref.startsWith('https://'))
              throw Error('News headline does not link to the original publisher');
            if(await headlines.first().getAttribute('target')!=='_blank')
              throw Error('News headlines should open the publisher in a new tab');
            console.log('NEWS CLICK-THROUGH PASS');
            const languages=await page.locator('[data-news-lang]').count();
            if(languages!==4)throw Error('Four-language news selection missing');
            for(const code of ['he','en','ar','ru']){
             await page.locator('[data-news-lang="'+code+'"]').click();
             if(await page.locator('html').getAttribute('lang')!==code)throw Error('News locale switch broken: '+code);
            }
            const bottom=await page.locator('.news-bottom>a').count();
            if(bottom!==5)throw Error('News page has wrong navigation button count');
            for(const width of [320,390]){
             await page.setViewportSize({width,height:844});
             const dims=await page.evaluate(()=>({scroll:document.documentElement.scrollWidth,window:window.innerWidth}));
             if(dims.scroll>dims.window+3)throw Error('Mobile news horizontal overflow '+JSON.stringify(dims));
            }
            const old={id:'obsolete',title:'Expired test story',date:'2026-01-01T06:00:00Z',category:'cars',art:'cars',summary:'old',publisher:'Test',url:'https://example.com'};
            await page.route('**/assets/news/news.json',route=>route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({version:1,retentionDays:30,lawsRetentionMonths:6,updated:new Date().toISOString(),items:[old]})}));
            await page.reload({waitUntil:'domcontentloaded'});
            await page.waitForTimeout(600);
            // The page intentionally falls back to a fresher GitHub feed when the
            // Pages source is missing or stale. Therefore current stories may
            // still be visible; only the injected expired story must be absent.
            const renderedExpired=await page.locator('.news-card').filter({hasText:'Expired test story'}).count();
            if(renderedExpired!==0)throw Error('Expired article leaked into news feed');
            if(errors.length)throw Error('JS page errors: '+errors.join(' | '));
            console.log('NEWS MOBILE PASS tabs='+tabs+' currentItems='+cards+' expiredRendered='+renderedExpired+' noHorizontalScroll=true JSerrors=0');
            await page.locator('#newsDelivery').click();
            await page.waitForURL(url=>/\/delivery(?:\.html)?\/?$/.test(new URL(url).pathname),{timeout:15000});
            console.log('NEWS DELIVERY LINK PASS');
            await page.goto('https://neoline-israel.pages.dev/delivery.html',{waitUntil:'domcontentloaded',timeout:40000});
            // The compact locator keeps networks in a modal sheet, not the
            // formerly visible desktop sidebar. Open the real control first.
            await page.locator('#locatorNetworksButton').waitFor({state:'visible',timeout:15000});
            await page.locator('#locatorNetworksButton').click();
            await page.locator('#locatorDialog').waitFor({state:'visible'});
            await page.locator('.network[data-provider="boxit"]').waitFor({state:'visible'});
            const colors=await page.evaluate(()=>({
              scheme:getComputedStyle(document.documentElement).colorScheme,
              card:getComputedStyle(document.querySelector('#locatorDialog')).backgroundColor,
              background:getComputedStyle(document.body).backgroundImage
            }));
            if(colors.scheme!=='light'||colors.card!=='rgb(255, 255, 255)'||!/245|255/.test(colors.background))
              throw Error('Pickup locator must use light NEOLINE colors '+JSON.stringify(colors));
            await page.locator('.network[data-provider="done"]').click();
            if(await page.locator('.network[data-provider="done"]').getAttribute('aria-pressed')!=='true')
              throw Error('Pickup network selection not working');
            if(await page.locator('#locatorDialog').isVisible())
              throw Error('Network selection should close the locator sheet');
            for(const width of [320,390]){
              await page.setViewportSize({width,height:844});
              const dims=await page.evaluate(()=>({scroll:document.documentElement.scrollWidth,width:innerWidth}));
              if(dims.scroll>dims.width+3)throw Error('Pickup mobile overflow '+JSON.stringify(dims));
            }
            if(errors.length)throw Error('Delivery JS page errors: '+errors.join(' | '));
            console.log('PICKUP LIGHT THEME PASS');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
