name: Verify published NEOLINE release on Cloudflare
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'catalog-ui.js'
      - 'catalog-ui.css'
      - 'catalog-i18n.js'
      - 'catalog-video.js'
      - 'assets/catalog/tutorial-videos.json'
      - 'assets/catalog/catalog.json'
      - 'assets/catalog/feature-media.json'
      - 'assets/catalog/feature-images/**'
      - 'neoline-academy.js'
      - 'neoline-academy.css'
      - 'teoria.html'
      - 'teoria*.js'
      - 'teoria*.css'
      - 'assets/teoria/ay-originals/**'
      - '.github/workflows/verify-live.yml'
permissions:
  contents: read
concurrency:
  group: verify-published-neoline-main
  cancel-in-progress: true
jobs:
  check-site:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Compare live Cloudflare files with this GitHub release
        env:
          GITHUB_COMMIT: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, re, time, urllib.request
          from pathlib import Path
          base = "https://neoline-israel.pages.dev/"
          revision = os.environ.get("GITHUB_COMMIT","")[:12]
          shop_files = ("catalog-ui.js","catalog-ui.css","catalog-i18n.js","catalog-video.js","neoline-academy.js","neoline-academy.css")
          game_files = ("teoria-optimized-01.js","teoria-optimized-02.js", "teoria-optimized-01.css","teoria-optimized-02.css","teoria-optimized-03.css","teoria-optimized-04.css")
          verified_data = ("assets/catalog/tutorial-videos.json","assets/catalog/catalog.json","assets/catalog/feature-media.json")
          feature_art = tuple(str(p) for p in sorted(Path("assets/catalog/feature-images").glob("*.webp")))
          native_file = Path("assets/teoria/ay-originals/manifest.json")
          native_files = ()
          if native_file.exists():
              manifest_native = json.loads(native_file.read_text(encoding="utf-8"))
              native_files = ("assets/teoria/ay-originals/manifest.json",) + tuple(
                  entry["url"].removeprefix("./")
                  for entry in manifest_native.get("tracks", {}).values()
              )
              assert len(native_files) > 1, "Native original music manifest contains no tracks"
              expected_user_songs = {
                  "Back_To_The_Future_2.ay",
                  "Beverly_Hills_Cop.ay",
                  "Cj_In_Usa.ay",
                  "Golden_Axe.ay",
                  "Rambo_3.ay",
              }
              published_user_songs = {
                  entry["file"] for entry in manifest_native.get("tracks", {}).values()
              }
              assert expected_user_songs <= published_user_songs, (
                  "Five supplied AY originals missing from the playable manifest: "
                  + repr(expected_user_songs-published_user_songs)
              )
              native_files += tuple(
                  "assets/teoria/originals/"+name
                  for name in sorted(expected_user_songs)
              )
          # AudioWorklet is loaded dynamically by the optimized script, not by an HTML tag.
          # Verify Cloudflare serves its updated bytes too (no stale SFX renderer).
          files = shop_files + game_files + verified_data + feature_art + native_files + ("teoria-ay8912-worklet.js",)
          local_pages = {
              "index.html": Path("index.html").read_text(encoding="utf-8"),
              "teoria.html": Path("teoria.html").read_text(encoding="utf-8")
          }
          markers = {}
          for path in shop_files + game_files:
              page = "index.html" if path in shop_files else "teoria.html"
              matches = re.findall(r'\./'+re.escape(path)+r'\?v=[^"\s]+', local_pages[page])
              if len(matches) != 1:
                  raise SystemExit(f"FAIL: {page} must reference one versioned {path}, found {len(matches)}")
              markers[path] = (page,matches[0])
          hashes = {path:hashlib.sha256(Path(path).read_bytes()).hexdigest() for path in files}
          def fetch(path):
              separator = '&' if '?' in path else '?'
              url = base+path+separator+'releasecheck='+revision
              request = urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 (NEOLINE release verification)","Cache-Control":"no-cache"})
              with urllib.request.urlopen(request, timeout=18) as response:
                  return response.read()
          last_reason = "not checked"
          for attempt in range(12):
              try:
                  live_pages = {
                      "index.html": fetch("").decode("utf-8","replace"),
                      "teoria.html": fetch("teoria.html").decode("utf-8","replace")
                  }
                  missing = [name for name,(page,marker) in markers.items()
                             if marker not in live_pages[page]]
                  if missing:
                      last_reason = "Cloudflare HTML is behind for: "+", ".join(missing)
                  else:
                      stale = [name for name,digest in hashes.items()
                               if hashlib.sha256(fetch(name)).hexdigest()!=digest]
                      if stale:
                          last_reason = "Cloudflare assets are behind: "+", ".join(stale)
                      else:
                          manifest = json.loads(fetch("assets/catalog/catalog.json"))
                          count = len(manifest.get("products", []))
                          feature_manifest = json.loads(fetch("assets/catalog/feature-media.json"))
                          groups = {int(item["id"]): len(item.get("features",[]))
                                    for item in feature_manifest.get("products", [])}
                          cable = next((p for p in manifest["products"] if p["id"] == 951833046070), None)
                          banner = "./assets/catalog/images/951833046070-3.webp"
                          invalid_gallery = (not cable or len(cable.get("images",[]))!=2
                                             or banner in cable.get("images",[]))
                          if count < 50:
                              last_reason = f"Catalogue data incomplete: {count} imported products"
                          elif invalid_gallery:
                              last_reason = "User-reported shipping promo still appears in live Power Cord Hybrid gallery"
                          elif groups.get(159268200852) != 6 or groups.get(1087255377614) != 4:
                              last_reason = f"Manufacturer art incomplete: {groups}"
                          else:
                              print(f"PASS: Cloudflare has 2 real Power Cord Hybrid photos, no blue shipping banner, ten illustrated manufacturer features and {count} products")
                              break
              except Exception as exc:
                  last_reason = f"{type(exc).__name__}: {exc}"
              print(f"Attempt {attempt+1}/12: {last_reason}",flush=True)
              if attempt < 11:
                  time.sleep(20)
          else:
              raise SystemExit("FAIL: latest GitHub change is not verified as live on Cloudflare. "+last_reason)
          PY
