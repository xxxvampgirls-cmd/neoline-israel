name: Verify GTA VI-inspired reversible driving theory theme on mobile
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'teoria.html'
      - 'teoria-gta6-style.css'
      - 'teoria-gta6-style.js'
      - 'teoria-hero-promo.js'
      - 'scripts/test_teoria_vice_theme.cjs'
      - 'scripts/test_teoria_cinematic.cjs'
      - 'teoria-vice-cinematic.css'
      - 'teoria-vice-reference-match.css'
      - 'teoria-vice-final-polish.css'
      - 'teoria-vice-live-reference.css'
      - 'teoria-vice-sunset-boulevard.css'
      - 'assets/teoria/vice-sunset-boulevard.svg'
      - 'teoria-slide-frame-air.css'
      - 'scripts/test_teoria_slide_frame_air.cjs'
      - 'teoria-vice-radar-wasted.css'
      - 'teoria-vice-radar-wasted.js'
      - 'scripts/test_teoria_vice_radar_wasted.cjs'
      - 'assets/teoria/vice-hero-reference.avif'
      - 'assets/teoria/vice-reference-card-sprite.avif'
      - 'teoria-vice-cinematic.js'
      - 'assets/teoria/vice-card-city.svg'
      - 'assets/teoria/vice-card-signs.svg'
      - 'assets/teoria/vice-card-exam.svg'
      - 'assets/teoria/vice-card-mistakes.svg'
      - 'assets/teoria/vice-card-marathon.svg'
      - 'assets/teoria/vice-cinematic-duo.svg'
      - 'assets/teoria/vice-cinematic-backdrop.svg'
      - 'assets/teoria/vice-hero-highlights.svg'
      - 'assets/teoria/vice-hd-*.svg'
      - 'assets/teoria/vice-approved-protagonists.webp'
      - '.github/workflows/test-teoria-vice-theme.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright and browser
        run: |
          npm install --no-save playwright
          npx playwright install chromium
      - name: Serve source and test normal and neon styles on mobile
        env:
          SAVE_BOULEVARD_SCREENSHOTS: '1'
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/vice-theme.log 2>&1 &
          node --check teoria-gta6-style.js
          node --check teoria-hero-promo.js
          node scripts/test_teoria_vice_theme.cjs
          node scripts/test_teoria_slide_frame_air.cjs
          node --check teoria-vice-radar-wasted.js
          node scripts/test_teoria_vice_radar_wasted.cjs
          node --check teoria-vice-cinematic.js
          node scripts/test_teoria_cinematic.cjs
