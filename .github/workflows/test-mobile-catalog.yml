name: Browser-check NEOLINE catalog on mobile
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-mobile-catalog.yml'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Prepare browser testing
        run: |
          npm install --no-save playwright
          npx playwright install chromium
      - name: Test live category filters, photos and details on a phone-sized browser
        run: |
          node <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:2,isMobile:true,hasTouch:true});
            const errors=[];
            page.on('pageerror',e=>errors.push(e.message));
            await page.goto('https://neoline-israel.pages.dev/',{waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForFunction(()=>document.querySelectorAll('#products .product').length>=50,{timeout:35000});
            for(const width of [320,390]){
              await page.setViewportSize({width,height:844});
              await page.waitForFunction(()=>{const img=document.querySelector('.header .brand-clean');return img?.complete && img.naturalWidth>0;},{timeout:15000});
              const mark=await page.locator('.header .brand-clean').boundingBox();
              const languages=await page.locator('.header .flag-switcher').boundingBox();
              if(!mark||!languages||mark.x+mark.width>languages.x+2)throw Error('Header logo overlaps languages at '+width+'px: '+JSON.stringify({mark,languages}));
              const logoSrc=await page.locator('.header .brand-clean').getAttribute('src');
              if(!logoSrc.includes('v=20261116-compact'))throw Error('Old logo still published');
              const imageXml=await page.evaluate(async src=>(await (await fetch(src)).text()),logoSrc);
              if(!imageXml.includes('scale(.82 .68)'))throw Error('Slim wordmark missing from SVG');
              const flag=await page.locator('[data-language="he"] svg').evaluate(el=>el.outerHTML);
              if(!flag.includes('M18 7.6 23.4 16.4'))throw Error('Israel flag was not updated');
              console.log('BRAND PASS mobileWidth='+width+' cleanLogo='+mark.width+' languageStart='+languages.x+' actualFlag=true');
            }
            await page.setViewportSize({width:390,height:844});
            const footSpace=await page.evaluate(()=>{
              const install=document.querySelector('#installation');
              const story=install.querySelector('.story');
              const footer=document.querySelector('footer.footer');
              const logo=footer.querySelector('.footer-brand');
              const details=footer.querySelector('.footer-grid');
              const p=footer.querySelector('[data-i="footerPricing"]');
              const end=footer.getBoundingClientRect().bottom;
              return {
                installBottom:parseFloat(getComputedStyle(install).paddingBottom),
                footerTop:parseFloat(getComputedStyle(footer).paddingTop),
                footerBottom:parseFloat(getComputedStyle(footer).paddingBottom),
                footerGap:parseFloat(getComputedStyle(details).rowGap),
                spaceAfterStory:Math.round(logo.getBoundingClientRect().top-story.getBoundingClientRect().bottom),
                lastTextToFooterBottom:Math.round(end-p.getBoundingClientRect().bottom)
              };
            });
            if(footSpace.installBottom>8||footSpace.footerTop>16||footSpace.footerBottom>16||
               footSpace.footerGap>12||footSpace.spaceAfterStory>35||footSpace.lastTextToFooterBottom>18){
               throw Error('Footer empty-space regression: '+JSON.stringify(footSpace));
            }
            console.log('FOOTER COMPACT PASS '+JSON.stringify(footSpace));
            const total=await page.locator('#products .product').count();
            const layout=await page.evaluate(()=>{
              const catalog=document.getElementById('catalog'),heading=catalog.querySelector('.section-head');
              const tab=catalog.querySelector('#tabs');
              return {status:!!document.getElementById('catalogSourceStatus'),
                paddingTop:parseFloat(getComputedStyle(catalog).paddingTop),
                headGap:parseFloat(getComputedStyle(heading).rowGap),
                sectionMargin:parseFloat(getComputedStyle(heading).marginBottom),
                titleTabDistance:Math.round(tab.getBoundingClientRect().top-heading.firstElementChild.getBoundingClientRect().bottom)};
            });
            if(layout.status||layout.paddingTop>16||layout.headGap>15||layout.titleTabDistance>28)
              throw Error('Catalog spacing/status issue: '+JSON.stringify(layout));
            console.log('CATALOG COMPACT PASS '+JSON.stringify(layout));
            const radios=page.locator('button[data-cat="radar"]');
            if(await radios.count()!==1)throw Error('Radar category button not found');
            await radios.click();
            const radarCount=await page.locator('#products .product').count();
            if(radarCount<2)throw Error('Radar product filtering failed: '+radarCount);
            const radarNames=await page.locator('#products .product .product-name').allTextContents();
            if(radarNames.some(name=>!/^Радар-детектор|^Сигнатурный радар-детектор/i.test(name)))throw Error('Accessories leaked into radar category: '+radarNames.join(', '));
            const details=page.locator('#products .product [data-details]');
            await details.first().click();
            if(!await page.locator('.catalog-import-detail').isVisible())throw Error('Imported product details did not open');
            const specCount=await page.locator('.catalog-import-property').count();
            if(specCount<5)throw Error('Imported radar technical specifications not shown: '+specCount);
            await page.screenshot({path:'/tmp/neoline-catalog-mobile.png'});
            console.log('MOBILE PASS totalProducts='+total+' radarProducts='+radarCount+' importedDetailsSpecs='+specCount+' JSerrors='+JSON.stringify(errors));
            if(errors.length)throw Error('JavaScript errors: '+errors.join('; '));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
