name: Audit authentic NEOLINE product photo galleries
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'assets/catalog/catalog.json'
      - 'assets/catalog/images/**'
      - 'assets/catalog/gallery-repair-report.json'
      - 'scripts/catalog_photo_quality.py'
      - 'scripts/audit_catalog_photos.py'
      - '.github/workflows/audit-catalog-images.yml'
permissions:
  contents: write
concurrency:
  group: neoline-gallery-audit
  cancel-in-progress: true
jobs:
  galleries:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image decoder
        run: python -m pip install --disable-pip-version-check 'Pillow>=11,<13'
      - name: Analyze real local gallery photos (no files deleted)
        run: python scripts/audit_catalog_photos.py
      - name: Keep photo review report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neoline-gallery-quality
          path: assets/catalog/gallery-quality.json
          if-no-files-found: warn
          retention-days: 21
      - name: Commit current photo quality counts after successful audit
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/catalog/gallery-quality.json
          if git diff --cached --quiet; then
            echo 'Photo quality report already current'
            exit 0
          fi
          git commit -m 'Refresh verified gallery quality after new source photo sync'
          git pull --rebase origin main
          git push origin HEAD:main
