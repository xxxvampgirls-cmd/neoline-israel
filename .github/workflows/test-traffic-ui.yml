name: Smoke-check urgent traffic news on mobile
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'news.html'
      - 'news-ui.js'
      - 'news-ui.css'
      - '.github/workflows/test-traffic-ui.yml'
permissions:
  contents: read
jobs:
  traffic-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify JavaScript syntax
        run: node --check news-ui.js
      - name: Install Chromium
        run: |
          npm install --no-save playwright
          npx playwright install chromium
      - name: Check live-UI rendering with mocked official alert and stale fallback
        run: |
          node <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
            const errors=[];page.on('pageerror',e=>errors.push(e.message));
            const source='https://raw.githubusercontent.com/xxxvampgirls-cmd/neoline-israel/traffic-live/assets/traffic/live.json';
            let data={version:1,checkedAt:new Date().toISOString(),sourceStatus:'ok',ttlMinutes:180,
              events:[{id:'Atanpolice/999999',publishedAt:new Date(Date.now()-5*60000).toISOString(),
                kind:'closure',roads:['6'],original:'כביש 6 נחסם לתנועה בעקבות תאונת דרכים. סעו בזהירות.',
                url:'https://t.me/Atanpolice/999999'}]};
            await page.route(u=>u.toString().startsWith(source),route=>route.fulfill({
              status:200,headers:{'content-type':'application/json','access-control-allow-origin':'*'},
              body:JSON.stringify(data)}));
            const origin='https://neoline-israel.pages.dev';
            let deployed=false;
            for(let n=0;n<8;n++){
              await page.goto(origin+'/news.html?traffic-ui-check='+n,{waitUntil:'domcontentloaded',timeout:30000});
              if(await page.locator('script[src*="traffic-v1"]').count()&&await page.locator('#trafficPanel').count()){
                deployed=true;break;
              }
              await page.waitForTimeout(6500);
            }
            if(!deployed)throw Error('Traffic news update not deployed yet');
            await page.waitForFunction(()=>document.querySelector('#trafficList .traffic-report'),null,{timeout:35000});
            const status=await page.locator('#trafficStatus').innerText();
            if(!/Свежих сообщений/.test(status))throw Error('Police update not shown: '+status);
            if(await page.locator('.news-feature-story--traffic').count()!==1)throw Error('Urgent slide missing');
            await page.locator('#trafficList summary').first().click();
            if(!await page.locator('.traffic-report-body p').first().isVisible())throw Error('Source detail not expandable');
            const dims=await page.evaluate(()=>({w:document.documentElement.scrollWidth,viewport:innerWidth}));
            if(dims.w>dims.viewport+3)throw Error('Traffic panel causes mobile overflow '+JSON.stringify(dims));
            // The Waze iframe is intentionally absent until someone opens the map.
            if(await page.locator('#trafficWazeFrame iframe').count())throw Error('Waze iframe is preloading');
            await page.locator('#trafficWaze>summary').click();
            await page.waitForFunction(()=>document.querySelector('#trafficWazeFrame iframe'),null,{timeout:5000});
            let embedded=await page.locator('#trafficWazeFrame iframe').getAttribute('src');
            if(!embedded.includes('https://embed.waze.com/ru/iframe?zoom=7&lat=31.53&lon=34.91'))
              throw Error('Wrong official Waze iframe source '+embedded);
            await page.locator('[data-waze-area="north"]').click();
            embedded=await page.locator('#trafficWazeFrame iframe').getAttribute('src');
            if(!embedded.includes('zoom=9&lat=32.84&lon=35.15'))
              throw Error('North region did not update map '+embedded);
            await page.locator('[data-news-lang="he"]').click();
            if(!/כבישי ישראל/.test(await page.locator('#trafficTitle').innerText()))throw Error('Hebrew translation missing');
            embedded=await page.locator('#trafficWazeFrame iframe').getAttribute('src');
            if(!embedded.includes('https://embed.waze.com/he/iframe?'))
              throw Error('Waze iframe language not updated '+embedded);
            await page.locator('#trafficWaze>summary').click();
            await page.waitForFunction(()=>!document.querySelector('#trafficWazeFrame iframe'),null,{timeout:5000});
            if(!await page.locator('#trafficWazeLoading').count())
              throw Error('Waze placeholder not restored on collapse');
            data={...data,sourceStatus:'unavailable',events:[]};
            await page.locator('#trafficRefresh').click();
            await page.waitForFunction(()=>/אינו זמין/.test(document.querySelector('#trafficStatus').textContent));
            if(await page.locator('.traffic-report').count())throw Error('Old alert displayed after upstream failure');
            if(await page.locator('.news-feature-story--traffic').count())throw Error('Stale urgent slide still showing');
            if(errors.length)throw Error('Page errors '+errors.join(' | '));
            // A mocked response can mask an actual browser CORS failure.
            // Confirm the public GitHub traffic branch is readable from Cloudflare Pages.
            await page.unroute(u=>u.toString().startsWith(source));
            const realFeed=await page.evaluate(async url=>{
              const response=await fetch(url+'?cors-test='+Date.now(),{cache:'no-store'});
              if(!response.ok)throw Error('Traffic feed HTTP '+response.status);
              const data=await response.json();
              return {version:data.version,status:data.sourceStatus,events:data.events?.length};
            },source);
            if(realFeed.version!==1||!Array.isArray(data.events))throw Error('Invalid real public feed '+JSON.stringify(realFeed));
            console.log('NEOLINE TRAFFIC UI PASS: source, carousel, expand, languages, stale fallback, mobile width, real browser CORS '+JSON.stringify(realFeed));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
