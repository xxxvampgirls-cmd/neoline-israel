name: Build transparent NEOLINE product photos
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/transparent-neoline.yml'
      - 'scripts/build_transparent_photos.py'
permissions:
  contents: write
jobs:
  transparent-photos:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image processing dependencies
        run: python -m pip install --disable-pip-version-check 'Pillow>=11,<13' 'numpy>=2,<3' 'opencv-python-headless>=4.10,<5' 'requests>=2.31,<3'
      - name: Create transparent PNGs from original product pictures
        run: python scripts/build_transparent_photos.py
      - name: Commit generated assets (only when available)
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/transparent/
          if git diff --cached --quiet; then
            echo 'No new transparent product images'
            exit 0
          fi
          git commit -m 'Generate transparent NEOLINE product photo assets'
          git pull --rebase origin main
          git push origin HEAD:main
