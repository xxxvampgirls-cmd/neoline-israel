name: Refresh verified Israeli traffic-police fines and operations
on:
  workflow_dispatch:
  schedule:
    - cron: '23 * * * *' # hourly, best effort (GitHub schedules can be delayed)
  push:
    branches: [main]
    paths:
      - 'scripts/sync_fines.py'
      - 'scripts/test_fines.py'
      - '.github/workflows/sync-fines.yml'
permissions:
  contents: write
concurrency:
  group: neoline-official-fines-live
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out source code
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install official-public-page libraries
        run: python -m pip install --disable-pip-version-check 'requests>=2.31,<3' 'beautifulsoup4>=4.12,<5'
      - name: Run safe extraction tests
        run: python -m unittest discover -s scripts -p test_fines.py -v
      - name: Preserve past verified reports from the live branch
        run: |
          git fetch --no-tags origin refs/heads/fines-live:refs/remotes/origin/fines-live
          git show origin/fines-live:assets/fines/operations.json > "$RUNNER_TEMP/neoline-fines-previous.json"
      - name: Gather exact figures from public police statements
        env:
          FINES_OUTPUT: /tmp/neoline-fines-live.json
          FINES_PREVIOUS: ${{ runner.temp }}/neoline-fines-previous.json
        run: python scripts/sync_fines.py
      - name: Validate counts, duplicate IDs and source attribution
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("/tmp/neoline-fines-live.json").read_text(encoding="utf-8"))
          assert x["version"]==1 and x["sourceStatus"] in ("ok","unavailable")
          assert len(x["reports"])<=130
          ids=[r["id"] for r in x["reports"]]
          assert len(ids)==len(set(ids)), "overlapping reports"
          for r in x["reports"]:
              assert r["period"] in ("operation","day","week","weekend")
              assert isinstance(r.get("count"),int) or (r.get("count") is None and isinstance(r.get("minimum"),int))
              assert r["sourceUrl"].startswith(("https://t.me/Atanpolice/","https://www.gov.il/","https://www.globes.co.il/"))
          assert Path("/tmp/neoline-fines-live.json").stat().st_size<150_000
          print("Verified source-linked operation reports:",len(ids))
          PY
      - name: Publish to separate branch without rebuilding Pages
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git worktree add -B fines-live "$RUNNER_TEMP/neoline-fines-worktree" origin/fines-live
          mkdir -p "$RUNNER_TEMP/neoline-fines-worktree/assets/fines"
          cp /tmp/neoline-fines-live.json "$RUNNER_TEMP/neoline-fines-worktree/assets/fines/operations.json"
          cd "$RUNNER_TEMP/neoline-fines-worktree"
          git add assets/fines/operations.json
          if git diff --cached --quiet; then
            echo "No change in police-source data"
            exit 0
          fi
          git commit -m "Fines: verified official enforcement updates [skip ci]"
          git pull --rebase origin fines-live
          git push origin HEAD:fines-live
