name: Refresh Israel automotive news (general + six-month law archive)
on:
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'  # twice hourly; backup watchdog triggers when overdue
  push:
    branches: [main]
    paths:
      - 'scripts/sync_news.py'
      - 'scripts/sync_road_videos.py'
      - 'scripts/youtube_road_discovery.py'
      - 'scripts/verified_auto_news.json'
      - 'scripts/telegram_news.py'
      - 'scripts/facebook_news.py'
      - 'scripts/facebook_pages.json'
      - 'scripts/build_news_thumbnails.py'
      - '.github/workflows/sync-news.yml'
permissions:
  contents: write
concurrency:
  group: israel-automotive-news-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out project
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install feed libraries
        run: python -m pip install --disable-pip-version-check 'requests>=2.31,<3' 'beautifulsoup4>=4.12,<5' 'feedparser>=6,<7' 'Pillow>=11,<13' 'yt-dlp>=2025.1'
      - name: Gather news with separate 30-day and six-month archive limits
        env:
          FACEBOOK_GRAPH_TOKEN: ${{ secrets.FACEBOOK_GRAPH_TOKEN }}
        run: python scripts/sync_news.py
      # News is the critical feed. Publish its already validated result BEFORE
      # auxiliary video discovery or thumbnail steps: failure of optional
      # dependencies must never freeze all news categories again.
      - name: Check news feed freshness and publish independently
        run: |
          python - <<'PY'
          import datetime as dt, json, pathlib, sys
          f = json.loads(pathlib.Path("assets/news/news.json").read_text(encoding="utf-8"))
          report = json.loads(pathlib.Path("assets/news/sync-report.json").read_text(encoding="utf-8"))
          now = dt.datetime.now(dt.timezone.utc)
          stamp = dt.datetime.fromisoformat(f["updated"].replace("Z", "+00:00"))
          age_min = (now - stamp).total_seconds() / 60
          assert f["version"] == 1 and f["retentionDays"] == 30 and f["lawsRetentionMonths"] == 6
          assert len(f["items"]) > 0, "Refusing to replace live news with empty snapshot"
          assert 0 <= age_min < 30, f"News fetch too old: {age_min:.1f} min"
          assert report["directLinksOnly"], "Unverified/non-direct news links"
          assert sum(int(v) for v in report.get("feeds", {}).values()) > 0, "No live news feed was read"
          assert len(report.get("sources", {})) >= 3, "Insufficient independent publishers"
          print("NEWS HEALTH OK:", len(f["items"]), "articles from",
                len(report["sources"]), "publishers, generated", round(age_min, 1), "minutes ago")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/news/news.json assets/news/sync-report.json assets/news/images/
          if git diff --cached --quiet; then
            echo "News feed has no changes (same validated snapshot)"
          else
            git commit -m "Refresh verified Israeli road news independently"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Test 30-day Israeli YouTube discovery and regional filtering (offline)
        run: python scripts/sync_road_videos.py --self-test
      - name: Refresh 30-day Israeli traffic videos (official + community YouTube)
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/sync_road_videos.py
      - name: Build compressed 16:9 image thumbnails (licensed photos; optional paid AI)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MAX_AI_PER_RUN: "0"
        run: python scripts/build_news_thumbnails.py
      - name: Strictly validate per-category retention and direct source links
        run: |
          python - <<'PY'
          import datetime as dt,json,calendar
          p=json.load(open("assets/news/news.json",encoding="utf-8"))
          now=dt.datetime.now(dt.timezone.utc)
          assert p["retentionDays"]==30 and p["lawsRetentionMonths"]==6
          mi=now.year*12+now.month-1-6
          year,month=divmod(mi,12)
          month+=1
          laws_cutoff=now.replace(year=year,month=month,day=min(now.day,calendar.monthrange(year,month)[1]))
          for item in p["items"]:
              age=now-dt.datetime.fromisoformat(item["date"].replace("Z","+00:00"))
              if item["category"]=="laws":
                  published=dt.datetime.fromisoformat(item["date"].replace("Z","+00:00"))
                  assert laws_cutoff-dt.timedelta(minutes=2)<=published<=now+dt.timedelta(hours=12),(item["title"],age)
              else:
                  assert dt.timedelta(hours=-12)<=age<=dt.timedelta(days=30,minutes=2),(item["title"],age)
              assert item["url"].startswith("https://")
              assert "google." not in item["url"].split("/")[2]
              assert "translations" in item
              from pathlib import Path
              if item.get("image"):
                  image=Path(item["image"].lstrip("./"))
                  assert image.is_file(),item["image"]
                  assert image.suffix==".webp",(image,item["image"])
                  assert image.stat().st_size<90_000,(image,image.stat().st_size)
          # Video gallery is a separate rolling 30-day index of genuine
          # YouTube videos. No links, dates or thumbnails may be fabricated.
          video=json.load(open("assets/news/road-videos.json",encoding="utf-8"))
          assert video["version"]==1 and video["retentionDays"]==30
          official={"news13","kan11","police"}
          allowed=official|{"youtube"}
          valid_categories={"accidents","radars","dashcam","funny","police","reports"}
          video_ids=set()
          for clip in video["items"]:
              vid=clip["id"]
              import re
              assert re.fullmatch(r"[A-Za-z0-9_-]{11}",vid),vid
              assert vid not in video_ids,("duplicate video",vid)
              video_ids.add(vid)
              assert clip["source"] in allowed,clip["source"]
              if clip["source"]=="youtube":
                  assert clip.get("localVerified") is True,("unverified Israel location",vid)
                  assert re.fullmatch(r"UC[A-Za-z0-9_-]{22}",clip.get("channelId","")),(vid,clip.get("channelId"))
                  assert clip.get("publisher","").strip(),("missing user-channel publisher",vid)
              assert clip["url"]=="https://www.youtube.com/watch?v="+vid,vid
              assert clip["category"] in valid_categories,vid
              assert isinstance(clip.get("tags"),list),("missing video topic tags",vid)
              assert all(tag in valid_categories for tag in clip["tags"]),vid
              assert isinstance(clip["title"],str) and clip["title"],vid
              published=dt.datetime.fromisoformat(clip["date"].replace("Z","+00:00"))
              age=now-published
              assert dt.timedelta(hours=-12)<=age<=dt.timedelta(days=30,minutes=2),vid
          print("Verified Israeli road-video metadata:",len(video_ids),
                "official:",sum(x["source"] in official for x in video["items"]),
                "community:",sum(x["source"]=="youtube" for x in video["items"]))
          # Files of expired stories must not remain in deployed news assets.
          image_dir=Path("assets/news/images")
          expected={item["id"]+".webp" for item in p["items"] if item.get("image")}
          actual={file.name for file in image_dir.glob("*.webp")}
          assert actual==expected,{"orphan_images":sorted(actual-expected),"missing_images":sorted(expected-actual)}
          assert not list(image_dir.glob("*.svg")), "Old SVG illustrations must not accumulate"
          print("Verified current news:",len(p["items"]),"image files:",len(actual),"orphan files: 0")
          PY
      - name: Publish refreshed rolling archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/news/
          if git diff --cached --quiet; then
            echo "No updates to news archive"
            exit 0
          fi
          git commit -m "Refresh Israeli news: 30-day general, six-month laws"
          git pull --rebase origin main
          git push origin HEAD:main
