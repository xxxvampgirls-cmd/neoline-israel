name: Refresh Israel automotive news (30-day archive)
on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'  # daily, 30-day archive
  push:
    branches: [main]
    paths:
      - 'scripts/sync_news.py'
      - 'scripts/build_news_thumbnails.py'
      - '.github/workflows/sync-news.yml'
permissions:
  contents: write
concurrency:
  group: israel-automotive-news-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out project
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install feed libraries
        run: python -m pip install --disable-pip-version-check 'requests>=2.31,<3' 'beautifulsoup4>=4.12,<5' 'feedparser>=6,<7' 'Pillow>=11,<13'
      - name: Gather current news, expire every item older than 30 days
        run: python scripts/sync_news.py
      - name: Build compressed 16:9 image thumbnails (licensed photos; optional paid AI)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MAX_AI_PER_RUN: "2"
        run: python scripts/build_news_thumbnails.py
      - name: Strictly validate 30-day retention and source links
        run: |
          python - <<'PY'
          import datetime as dt,json
          p=json.load(open("assets/news/news.json",encoding="utf-8"))
          now=dt.datetime.now(dt.timezone.utc)
          assert p["retentionDays"]==30
          for item in p["items"]:
              age=now-dt.datetime.fromisoformat(item["date"].replace("Z","+00:00"))
              assert dt.timedelta(0)<=age<=dt.timedelta(days=30,minutes=2),(item["title"],age)
              assert item["url"].startswith("https://")
              assert "google." not in item["url"].split("/")[2]
              assert "translations" in item
              from pathlib import Path
              if item.get("image"):
                  image=Path(item["image"].lstrip("./"))
                  assert image.is_file(),item["image"]
                  assert image.suffix==".webp",(image,item["image"])
                  assert image.stat().st_size<90_000,(image,image.stat().st_size)
          print("Verified current news:",len(p["items"]))
          PY
      - name: Publish refreshed rolling archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/news/
          if git diff --cached --quiet; then
            echo "No updates to news archive"
            exit 0
          fi
          git commit -m "Refresh Israel automotive news and remove items older than 30 days"
          git pull --rebase origin main
          git push origin HEAD:main
