name: Refresh Israel automotive news (general + six-month law archive)
on:
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'  # twice hourly; backup watchdog triggers when overdue
  push:
    branches: [main]
    paths:
      - 'scripts/sync_news.py'
      - 'scripts/verified_auto_news.json'
      - 'scripts/telegram_news.py'
      - 'scripts/facebook_news.py'
      - 'scripts/facebook_pages.json'
      - 'scripts/build_news_thumbnails.py'
      - '.github/workflows/sync-news.yml'
permissions:
  contents: write
concurrency:
  group: israel-automotive-news-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out project
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install fast news metadata libraries
        run: python -m pip install --disable-pip-version-check 'requests>=2.31,<3' 'beautifulsoup4>=4.12,<5' 'feedparser>=6,<7'
      - name: Validate collector syntax
        run: python -m py_compile scripts/sync_news.py scripts/telegram_news.py scripts/facebook_news.py
      - name: Gather news with separate 30-day and six-month archive limits
        env:
          FACEBOOK_GRAPH_TOKEN: ${{ secrets.FACEBOOK_GRAPH_TOKEN }}
        run: python scripts/sync_news.py
      # News is the critical feed. Publish its already validated result BEFORE
      # auxiliary video discovery or thumbnail steps: failure of optional
      # dependencies must never freeze all news categories again.
      - name: Check news feed freshness and publish independently
        run: |
          python - <<'PY'
          import datetime as dt, json, pathlib, sys
          f = json.loads(pathlib.Path("assets/news/news.json").read_text(encoding="utf-8"))
          report = json.loads(pathlib.Path("assets/news/sync-report.json").read_text(encoding="utf-8"))
          now = dt.datetime.now(dt.timezone.utc)
          stamp = dt.datetime.fromisoformat(f["updated"].replace("Z", "+00:00"))
          age_min = (now - stamp).total_seconds() / 60
          assert f["version"] == 1 and f["retentionDays"] == 30 and f["lawsRetentionMonths"] == 6
          assert len(f["items"]) > 0, "Refusing to replace live news with empty snapshot"
          assert 0 <= age_min < 30, f"News fetch too old: {age_min:.1f} min"
          assert report["directLinksOnly"], "Unverified/non-direct news links"
          assert sum(int(v) for v in report.get("feeds", {}).values()) > 0, "No live news feed was read"
          assert len(report.get("sources", {})) >= 3, "Insufficient independent publishers"
          print("NEWS HEALTH OK:", len(f["items"]), "articles from",
                len(report["sources"]), "publishers, generated", round(age_min, 1), "minutes ago")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/news/news.json assets/news/sync-report.json assets/news/images/
          if git diff --cached --quiet; then
            echo "News feed has no changes (same validated snapshot)"
          else
            git commit -m "Refresh verified Israeli road news independently"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
