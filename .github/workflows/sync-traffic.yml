name: NEOLINE Traffic - police road alerts (independent data branch)
on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/sync_traffic.py'
      - 'scripts/test_traffic.py'
      - '.github/workflows/sync-traffic.yml'
permissions:
  contents: write
concurrency:
  group: neoline-traffic-feed
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out source code
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: true
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install public-page parser
        run: python -m pip install --disable-pip-version-check 'requests>=2.31,<3' 'beautifulsoup4>=4.12,<5'
      - name: Unit test expiry and cautious classification
        run: python -m unittest discover -s scripts -p test_traffic.py -v
      - name: Retrieve official traffic police public Telegram preview
        run: python scripts/sync_traffic.py
      - name: Validate minimal public payload
        run: |
          python - <<'PY'
          import json,datetime as dt
          f='/tmp/neoline-traffic-live.json'
          d=json.load(open(f,encoding='utf-8'))
          assert d['version']==1 and d['sourceStatus'] in ('ok','unavailable')
          assert len(d['events'])<=6
          assert all(x['url'].startswith('https://t.me/Atanpolice/') for x in d['events'])
          now=dt.datetime.now(dt.timezone.utc)
          assert all(-5<=(now-dt.datetime.fromisoformat(x['publishedAt'].replace('Z','+00:00'))).total_seconds()/60<=180.5 for x in d['events'])
          assert len(open(f,'rb').read())<12000
          print('Cautious feed verified:',len(d['events']),'official posts')
          PY
      - name: Publish JSON to traffic-live branch only (never rebuild Cloudflare Pages)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags origin refs/heads/traffic-live:refs/remotes/origin/traffic-live
          git worktree add -B traffic-live "$RUNNER_TEMP/neoline-traffic-live" origin/traffic-live
          mkdir -p "$RUNNER_TEMP/neoline-traffic-live/assets/traffic"
          cp /tmp/neoline-traffic-live.json "$RUNNER_TEMP/neoline-traffic-live/assets/traffic/live.json"
          cd "$RUNNER_TEMP/neoline-traffic-live"
          git add assets/traffic/live.json
          if git diff --cached --quiet; then
            echo "Feed unchanged"
            exit 0
          fi
          git commit -m "Traffic: source timestamp and short-lived official reports [skip ci]"
          git push origin HEAD:traffic-live
