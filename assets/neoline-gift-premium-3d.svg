<svg xmlns="http://www.w3.org/2000/svg" width="600" height="500" viewBox="0 0 600 500" role="img" aria-label="Объёмная подарочная коробка NEOLINE: чёрный графит, голубая диагональ, синий бант с золотой окантовкой">
<defs>
